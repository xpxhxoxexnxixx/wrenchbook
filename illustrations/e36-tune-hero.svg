<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Tuning stages</title><rect width="800" height="460" fill="#F9F9F5"/><rect x="80" y="60" width="260" height="48" rx="6" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2"/><text x="96" y="90" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1B1F24" text-anchor="start">Stage 1</text><text x="360" y="82" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Software only</text><rect x="120" y="132" width="260" height="48" rx="6" fill="#DCEBEA" stroke="#1B1F24" stroke-width="2"/><text x="136" y="162" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1B1F24" text-anchor="start">Stage 2</text><text x="400" y="154" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">+ 3.5 in HFM, injectors, intake</text><rect x="160" y="204" width="260" height="48" rx="6" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2"/><text x="176" y="234" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1B1F24" text-anchor="start">Stage 3</text><text x="440" y="226" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">+ cams (stock manifold)</text><rect x="200" y="276" width="260" height="48" rx="6" fill="#DCEBEA" stroke="#1B1F24" stroke-width="2"/><text x="216" y="306" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1B1F24" text-anchor="start">Stage 3+</text><text x="480" y="298" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">+ M50 manifold</text><rect x="240" y="348" width="260" height="48" rx="6" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2"/><text x="256" y="378" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#1B1F24" text-anchor="start">Stage 4</text><text x="520" y="370" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">+ headers</text><text x="80" y="440" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="start">Each stage needs software written for its exact parts.</text></svg>