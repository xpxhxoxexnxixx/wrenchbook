<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Fill and drain plugs</title><rect width="800" height="460" fill="#F9F9F5"/><rect x="70" y="130" width="240" height="120" rx="14" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><circle cx="260" cy="160" r="11" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><circle cx="260" cy="220" r="11" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="70" y="90" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1B1F24" text-anchor="start">Transmission</text><text x="90" y="300" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0E494D" text-anchor="start">Fill plug (open first)</text><line x1="130" y1="288" x2="254" y2="164" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="254" cy="164" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="90" y="330" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FF5A28" text-anchor="start">Drain plug</text><line x1="130" y1="318" x2="254" y2="224" stroke="#FF5A28" stroke-width="1.5" stroke-linecap="round"/><circle cx="254" cy="224" r="3.5" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><rect x="460" y="130" width="240" height="120" rx="14" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><circle cx="650" cy="160" r="11" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><circle cx="650" cy="220" r="11" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="460" y="90" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1B1F24" text-anchor="start">Differential</text><text x="480" y="300" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Check for a label by the plug:</text><text x="480" y="318" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">it names the fluid</text><text x="400" y="430" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="middle">Open the fill plug before the drain plug.</text></svg>