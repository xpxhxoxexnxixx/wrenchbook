<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Rear camber and toe</title><rect width="800" height="460" fill="#F9F9F5"/><line x1="40" y1="380" x2="360" y2="380" stroke="#B7B7B4" stroke-width="3" stroke-linecap="round"/><text x="200" y="52" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1B1F24" text-anchor="middle">Camber (rear view)</text><path d="M152.9,222.5 L222.1,211.5 L247.1,369.5 L177.9,380.5 Z" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="200" y1="200" x2="200" y2="372" stroke="#B7B7B4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="24" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0E494D" text-anchor="start">Top leans in:</text><text x="24" y="138" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0E494D" text-anchor="start">negative camber</text><text x="200" y="412" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7078" text-anchor="middle">Lowering pulls it in</text><text x="600" y="52" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1B1F24" text-anchor="middle">Toe (top view)</text><path d="M581.3,152.1 L636.9,159.0 L618.7,307.9 L563.1,301.0 Z" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="600" y1="120" x2="600" y2="345" stroke="#B7B7B4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="650" y="140" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0E494D" text-anchor="start">Front of wheel</text><text x="650" y="158" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0E494D" text-anchor="start">points in: toe-in</text><text x="600" y="412" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7078" text-anchor="middle">Shop sets camber first, then toe</text></svg>