<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 278" role="img" aria-label="Schematic of a single-turbo VR6 as the complete kits build it: kit exhaust manifold into the turbo, downpipe out, compressed air through an intercooler to the intake, injectors and software sized to match, oil and coolant lines to the turbo"><rect width="600" height="278" fill="#F9F9F5"></rect><text x="300" y="18" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">schematic · exhaust side up (firewall), intake side down</text><rect x="180" y="140" width="240" height="60" rx="10" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></rect><text x="300" y="168" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">3.2 VR6</text><text x="300" y="184" text-anchor="middle" fill="#F1FAFF" font-size="8" font-weight="500" font-family="Plus Jakarta Sans, system-ui, sans-serif">head + spacer (compression drop)</text><rect x="180" y="114" width="240" height="26" rx="6" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></rect><text x="300" y="131" text-anchor="middle" fill="#F1FAFF" font-size="8" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">kit cast exhaust manifold · O2 bungs kept in place</text><circle cx="480" cy="110" r="30" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></circle><circle cx="480" cy="110" r="14" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"></circle><text x="480" y="114" text-anchor="middle" fill="#1B1F24" font-size="7" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">turbo</text><path d="M420 127 H450" fill="none" stroke="#1B1F24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M510 110 H550 V226" fill="none" stroke="#1B1F24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M510 110 H550 V226" fill="none" stroke="#B5B9C0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M480 80 V40 H130 V60" fill="none" stroke="#1F4FD6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" ></path><rect x="90" y="60" width="80" height="26" rx="6" fill="#4F9AA1" stroke="#1B1F24" stroke-width="1.5"></rect><text x="130" y="77" text-anchor="middle" fill="#FFFFFF" font-size="7" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">intercooler</text><path d="M130 86 V160 H180" fill="none" stroke="#1F4FD6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" ></path><rect x="60" y="150" width="40" height="16" rx="3" fill="#F2B600" stroke="#1B1F24" stroke-width="1"></rect><text x="80" y="161" text-anchor="middle" fill="#1B1300" font-size="7" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">inj.</text><path d="M455 92 L440 76 M462 132 L452 150" fill="none" stroke="#C89B3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M540 40 H480" fill="none" stroke="#7FA6E6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M550 226 V240 H500" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="496" y="243" text-anchor="end" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">downpipe → your cat-back</text><text x="560" y="32" text-anchor="middle" fill="#1F4FD6" font-size="8" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">air in</text><path d="M170 73 H200" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="204" y="70" text-anchor="start" fill="#4F9AA1" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">charge air, cooled</text><text x="204" y="82" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">034: front-mount · HPA FT: liquid-cooled manifold</text><path d="M80 166 V240 H100" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="104" y="243" text-anchor="start" fill="#936700" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">injectors + FPR + software</text><path d="M452 150 V214 H430" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="426" y="217" text-anchor="end" fill="#C89B3C" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">oil feed + coolant</text><text x="426" y="229" text-anchor="end" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">return never uphill</text><text x="300.0" y="266" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">In the box: what's drawn. Not in the box: head gasket set, DSG software, plugs, gauges, cat-back.</text></svg>