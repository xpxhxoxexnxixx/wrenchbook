<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480"><title>Rear shock mount, plate and tower</title><rect width="800" height="480" fill="#F9F9F5"/><line x1="250" y1="30" x2="250" y2="440" stroke="#B7B7B4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><rect x="236" y="44" width="28" height="14" rx="0" fill="#1B1F24" stroke="#1B1F24" stroke-width="1"/><line x1="294" y1="51.0" x2="400" y2="51.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><text x="412" y="49.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Shaft nut</text><text x="412" y="67.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">sizes vary shock to shock</text><rect x="180" y="92" width="140" height="8" rx="0" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><line x1="324" y1="96.0" x2="400" y2="96.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><text x="412" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Reinforcement plate</text><text x="412" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">stops the tower cracking</text><rect x="210" y="134" width="80" height="36" rx="0" fill="#DCEBEA" stroke="#1B1F24" stroke-width="2"/><line x1="294" y1="152.0" x2="400" y2="152.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><text x="412" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Rubber mount</text><text x="412" y="168.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">hardens and splits with age</text><rect x="190" y="204" width="120" height="6" rx="0" fill="#B7B7B4" stroke="#1B1F24" stroke-width="1"/><line x1="324" y1="207.0" x2="400" y2="207.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><text x="412" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Gasket</text><text x="412" y="223.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">new with the mount</text><rect x="150" y="244" width="200" height="14" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2"/><line x1="354" y1="251.0" x2="400" y2="251.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><text x="412" y="249.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FF5A28" text-anchor="start">Shock tower</text><text x="412" y="267.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FF5A28" text-anchor="start">check for cracks at the holes</text><rect x="242" y="292" width="16" height="100" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2"/><line x1="294" y1="342.0" x2="400" y2="342.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><text x="412" y="340.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Shock shaft</text><text x="412" y="358.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">supported while the mount is off</text></svg>