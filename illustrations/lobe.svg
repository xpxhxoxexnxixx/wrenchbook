<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 336" role="img" aria-label="Cam lobe on its flank makes the pump easy to seat; on its nose the spring is fully compressed. Below, tighten the three bolts alternately." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="400" height="336" fill="#F4F5F7"></rect><line x1="200" y1="14" x2="200" y2="200" stroke="#8A8F98" stroke-dasharray="4 4"></line><text x="100" y="26" text-anchor="middle" fill="#1F4FD6" font-size="14" font-weight="800" font-family="Archivo, system-ui, sans-serif">Lobe on the flank</text><text x="100" y="42" text-anchor="middle" fill="#1F4FD6" font-size="11" font-weight="400" font-family="Archivo, system-ui, sans-serif">pump seats easily</text><path d="M100 60 l10 5 l-20 5 l10 0 l10 5 l-20 5 l10 0 l10 5 l-20 5 l10 0 l10 5 l-20 5 l10 0 l10 5 l-20 5 l10 0" fill="none" stroke="#1B1F24" stroke-width="2"></path><rect x="90" y="110" width="20" height="30" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><path d="M65 124 V160 H135 V124" fill="none" stroke="#1B1F24" stroke-width="6" stroke-linejoin="round"></path><g transform="rotate(-90 100 200)"><path d="M100 152 C 125.5 152, 134 184.7, 134 200 A 34 34 0 1 1 66 200 C 66 184.7, 74.5 152, 100 152 Z" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></path><circle cx="100" cy="200" r="6.800000000000001" fill="#8A8F98" stroke="#1B1F24" stroke-width="1.5"></circle></g><text x="300" y="26" text-anchor="middle" fill="#1B1F24" font-size="14" font-weight="800" font-family="Archivo, system-ui, sans-serif">Lobe on the nose</text><rect x="240" y="32" width="120" height="14" fill="#F2B600"></rect><text x="300" y="43" text-anchor="middle" fill="#1B1F24" font-size="11" font-weight="700" font-family="Archivo, system-ui, sans-serif">spring fully compressed</text><path d="M300 60 l10 2.2 l-20 2.2 l10 0 l10 2.2 l-20 2.2 l10 0 l10 2.2 l-20 2.2 l10 0 l10 2.2 l-20 2.2 l10 0 l10 2.2 l-20 2.2 l10 0" fill="none" stroke="#1B1F24" stroke-width="2"></path><rect x="290" y="82" width="20" height="30" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><path d="M265 96 V132 H335 V96" fill="none" stroke="#1B1F24" stroke-width="6" stroke-linejoin="round"></path><g transform="rotate(0 300 200)"><path d="M300 152 C 325.5 152, 334 184.7, 334 200 A 34 34 0 1 1 266 200 C 266 184.7, 274.5 152, 300 152 Z" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></path><circle cx="300" cy="200" r="6.800000000000001" fill="#8A8F98" stroke="#1B1F24" stroke-width="1.5"></circle></g><line x1="20" y1="222" x2="380" y2="222" stroke="#8A8F98"></line><text x="20" y="248" text-anchor="start" fill="#1B1F24" font-size="13" font-weight="700" font-family="Archivo, system-ui, sans-serif">Three bolts. Alternate, a little at a time.</text><circle cx="90" cy="290" r="26" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></circle><circle cx="90" cy="290" r="10" fill="#1B1F24"></circle><circle cx="90" cy="266" r="6" fill="#1F4FD6"></circle><text x="90" y="269" text-anchor="middle" fill="#fff" font-size="9" font-weight="800" font-family="Archivo, system-ui, sans-serif">1</text><circle cx="111" cy="302" r="6" fill="#1F4FD6"></circle><text x="111" y="305" text-anchor="middle" fill="#fff" font-size="9" font-weight="800" font-family="Archivo, system-ui, sans-serif">2</text><circle cx="69" cy="302" r="6" fill="#1F4FD6"></circle><text x="69" y="305" text-anchor="middle" fill="#fff" font-size="9" font-weight="800" font-family="Archivo, system-ui, sans-serif">3</text><text x="135" y="286" text-anchor="start" fill="#1B1F24" font-size="12" font-weight="600" font-family="Archivo, system-ui, sans-serif">Snug 1 → 2 → 3, then go around again</text><text x="135" y="302" text-anchor="start" fill="#1B1F24" font-size="12" font-weight="600" font-family="Archivo, system-ui, sans-serif">Final torque: 10 Nm on each</text><text x="135" y="316" text-anchor="start" fill="#0E494D" font-size="11" font-weight="400" font-family="Archivo, system-ui, sans-serif">Never fully tighten one bolt</text><text x="135" y="328" text-anchor="start" fill="#0E494D" font-size="11" font-weight="400" font-family="Archivo, system-ui, sans-serif">while the others are loose</text></svg>