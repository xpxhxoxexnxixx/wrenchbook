<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 356" role="img" aria-label="Cam lobe on its flank makes the pump easy to seat; on its nose the spring is compressed. Below, tighten the three bolts alternately."><rect width="600" height="356" fill="#F9F9F5"></rect><text x="140" y="24" text-anchor="middle" fill="#1F4FD6" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">Lobe on the flank</text><text x="140" y="39" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">pump seats easily</text><path d="M140 54 l10 4.6 l-20 4.6 l10 0 l10 4.6 l-20 4.6 l10 0 l10 4.6 l-20 4.6 l10 0 l10 4.6 l-20 4.6 l10 0 l10 4.6 l-20 4.6 l10 0" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ></path><rect x="130" y="100" width="20" height="28" rx="0" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><path d="M105 112 V146 H175 V112" fill="none" stroke="#1B1F24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" ></path><g transform="rotate(-90 140 190)"><path d="M140 148 C 162.5 148, 170 176.5, 170 190 A 30 30 0 1 1 110 190 C 110 176.5, 117.5 148, 140 148 Z" fill="#4A4F58" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ></path><circle cx="140" cy="190" r="6.0" fill="#8A8F98" stroke="#1B1F24" stroke-width="1.5"></circle></g><path d="M280 20 V230" fill="none" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"></path><text x="420" y="24" text-anchor="middle" fill="#1B1F24" font-size="13" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">Lobe on the nose</text><text x="420" y="39" text-anchor="middle" fill="#936700" font-size="10" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">spring fully compressed, bolts under load</text><path d="M420 54 l10 2.2 l-20 2.2 l10 0 l10 2.2 l-20 2.2 l10 0 l10 2.2 l-20 2.2 l10 0 l10 2.2 l-20 2.2 l10 0 l10 2.2 l-20 2.2 l10 0" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ></path><rect x="410" y="76" width="20" height="28" rx="0" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><path d="M385 88 V122 H455 V88" fill="none" stroke="#1B1F24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" ></path><g transform="rotate(0 420 190)"><path d="M420 148 C 442.5 148, 450 176.5, 450 190 A 30 30 0 1 1 390 190 C 390 176.5, 397.5 148, 420 148 Z" fill="#4A4F58" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ></path><circle cx="420" cy="190" r="6.0" fill="#8A8F98" stroke="#1B1F24" stroke-width="1.5"></circle></g><path d="M20 244 H540" fill="none" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" ></path><text x="20" y="268" text-anchor="start" fill="#1B1F24" font-size="11" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Three bolts. Alternate, a little at a time, in this order:</text><circle cx="70" cy="318" r="26" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></circle><circle cx="70" cy="318" r="10" fill="#1B1F24" stroke="#1B1F24" stroke-width="2"></circle><circle cx="70" cy="292" r="7" fill="#0E5371" stroke="#1B1F24" stroke-width="1"></circle><text x="70" y="295" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">1</text><circle cx="92" cy="332" r="7" fill="#0E5371" stroke="#1B1F24" stroke-width="1"></circle><text x="92" y="335" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">2</text><circle cx="48" cy="332" r="7" fill="#0E5371" stroke="#1B1F24" stroke-width="1"></circle><text x="48" y="335" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">3</text><text x="120" y="312" text-anchor="start" fill="#1B1F24" font-size="11" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">Snug 1 → 2 → 3, then go around again</text><text x="120" y="328" text-anchor="start" fill="#0E494D" font-size="10" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">Final torque 10 Nm each. Never fully tighten one while the others are loose.</text></svg>