<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400"><rect width="800" height="400" fill="#F9F9F5"/><text x="30" y="42" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0E494D" text-anchor="start">Rack and tie rods</text><text x="30" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5A5F68" text-anchor="start">Inner rod threads into the rack inside the boot</text><rect x="260" y="190" width="280" height="40" rx="4" fill="#E6EEF0" stroke="#1B1F24" stroke-width="2"/><rect x="220" y="195" width="40" height="30" rx="4" fill="#9AD4D7" stroke="#1B1F24" stroke-width="2"/><rect x="540" y="195" width="40" height="30" rx="4" fill="#9AD4D7" stroke="#1B1F24" stroke-width="2"/><line x1="220" y1="210" x2="110" y2="210" stroke="#1B1F24" stroke-width="6" stroke-linecap="round"/><line x1="580" y1="210" x2="690" y2="210" stroke="#1B1F24" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="210" r="12" fill="#0E494D" stroke="#0E494D" stroke-width="2"/><circle cx="700" cy="210" r="12" fill="#0E494D" stroke="#0E494D" stroke-width="2"/><text x="400" y="170" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1B1F24" text-anchor="middle">Steering rack</text><text x="240" y="260" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B1F24" text-anchor="middle">Boot</text><text x="100" y="250" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B1F24" text-anchor="middle">Outer end</text><text x="165" y="190" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B1F24" text-anchor="middle">Inner rod</text><text x="400" y="340" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5A5F68" text-anchor="middle">Inner to rack 100 Nm · end nut 65 Nm · locknut 45 Nm (BMW TIS)</text></svg>