<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" role="img" aria-label="Front view with the bumper cover off. A large front-mount core hangs on brackets from the crash beam in front of the factory sandwich core, which stays in place and is bypassed. The turbo outlet on the passenger side feeds the core's passenger tank; the driver tank feeds up to the throttle body pipe."><rect width="700" height="320" fill="#F9F9F5"/><text x="350" y="22" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">front view · front-mount core on the crash beam, factory core bypassed</text><rect x="110" y="70" width="480" height="24" rx="6" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"/><text x="350" y="86" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">crash beam (existing holes)</text><rect x="200" y="120" width="300" height="50" rx="6" fill="none" stroke="#8A8F98" stroke-width="2" stroke-dasharray="6 4"/><text x="350" y="150" text-anchor="middle" fill="#8A8F98" font-size="8" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">factory core, left in place, hoses off</text><rect x="150" y="94" width="10" height="90" fill="#1B1F24"/><rect x="540" y="94" width="10" height="90" fill="#1B1F24"/><rect x="160" y="180" width="380" height="70" rx="6" fill="#C8102E" stroke="#1B1F24" stroke-width="2"/><text x="350" y="220" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">front-mount core</text><rect x="130" y="176" width="34" height="78" rx="8" fill="#0B4664" stroke="#1B1F24" stroke-width="2"/><rect x="536" y="176" width="34" height="78" rx="8" fill="#0B4664" stroke="#1B1F24" stroke-width="2"/><path d="M600 110 Q610 150 585 200 L570 214" fill="none" stroke="#1B1F24" stroke-width="12" stroke-linecap="round"/><path d="M600 110 Q610 150 585 200 L570 214" fill="none" stroke="#F2B600" stroke-width="7" stroke-linecap="round"/><path d="M100 110 Q90 150 115 200 L130 214" fill="none" stroke="#1B1F24" stroke-width="12" stroke-linecap="round"/><path d="M100 110 Q90 150 115 200 L130 214" fill="none" stroke="#4F9AA1" stroke-width="7" stroke-linecap="round"/><text x="600" y="104" text-anchor="middle" fill="#1B1F24" font-size="8" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">from turbo outlet</text><text x="100" y="104" text-anchor="middle" fill="#1B1F24" font-size="8" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">to throttle body pipe</text><circle cx="155" cy="80" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="545" cy="80" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="155" cy="178" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="545" cy="178" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><path d="M155 184 L155 272" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="155" y="286" text-anchor="middle" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">bracket → beam bolts, then bracket → tank</text><path d="M553 215 L610 250" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="614" y="254" text-anchor="start" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">inlet tank, passenger side</text><text x="614" y="267" text-anchor="start" fill="#0E494D" font-size="8" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">outlet tank on the driver side</text><text x="350" y="304" text-anchor="middle" fill="#4A4F58" font-size="8" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">centre the core in the bumper opening · nothing touches the beam, headlight or bumper foam</text></svg>