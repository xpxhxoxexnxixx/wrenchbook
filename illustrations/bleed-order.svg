if">2</text><text x="372" y="140" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">front-right</text><rect x="178" y="176" width="20" height="48" rx="5" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></rect><circle cx="188" cy="200" r="13" fill="#0E5371" stroke="#FFFFFF" stroke-width="2"></circle><text x="188" y="205" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900" font-family="Plus Jakarta Sans, system-ui, sans-serif">3</text><text x="188" y="244" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">rear-left</text><rect x="362" y="176" width="20" height="48" rx="5" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></rect><circle cx="372" cy="200" r="13" fill="#0E5371" stroke="#FFFFFF" stroke-width="2"></circle><text x="372" y="205" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="900" font-family="Plus Jakarta Sans, system-ui, sans-serif">4</text><text x="372" y="244" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">rear-right</text><circle cx="316" cy="160" r="10" fill="#1F4FD6" stroke="#FFFFFF" stroke-width="2"></circle><text x="316" y="164" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="900" font-family="Plus Jakarta Sans, system-ui, sans-serif">0</text><path d="M326 160 H400" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="404" y="157" text-anchor="start" fill="#1F4FD6" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">clutch slave first</text><text x="404" y="169" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">manual cars only</text><text x="300.0" y="264" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus J