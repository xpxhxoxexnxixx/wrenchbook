<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 282" role="img" aria-label="Top of the VR6 with the intake manifold removed: valve cover with the oil separator set into its front, breather hose, six plug wells, and the manifold's mating face on the head" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="600" height="282" fill="#F9F9F5"></rect><text x="300" y="18" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">top of the VR6 with the intake manifold removed (front of car to the left)</text><rect x="60" y="120" width="480" height="90" rx="10" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></rect><text x="300" y="168" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">cylinder head</text><rect x="90" y="70" width="420" height="50" rx="8" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></rect><text x="300" y="98" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">valve cover</text><circle cx="120" cy="120" r="7" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"></circle><circle cx="184" cy="120" r="7" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"></circle><circle cx="248" cy="120" r="7" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"></circle><circle cx="312" cy="120" r="7" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"></circle><circle cx="376" cy="120" r="7" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"></circle><circle cx="440" cy="120" r="7" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"></circle><rect x="96" y="78" width="46" height="34" rx="6" fill="#C89B3C" stroke="#1B1F24" stroke-width="1.5"></rect><text x="119" y="99" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">sep.</text><path d