<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Front and rear sway bar end links</title><rect width="800" height="460" fill="#F9F9F5"/><rect x="60" y="80" width="280" height="24" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2"/><text x="200" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7078" text-anchor="middle">Strut bracket</text><line x1="200" y1="104" x2="200" y2="250" stroke="#1B1F24" stroke-width="5" stroke-linecap="round"/><circle cx="200" cy="104" r="9" fill="#F9F9F5" stroke="#1B1F24" stroke-width="2"/><circle cx="200" cy="250" r="9" fill="#F9F9F5" stroke="#1B1F24" stroke-width="2"/><rect x="60" y="259" width="280" height="22" rx="0" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="200" y="306" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0E494D" text-anchor="middle">Sway bar</text><text x="240" y="160" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Ball joint</text><text x="240" y="178" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">at each end</text><line x1="234" y1="156" x2="208" y2="108" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="208" cy="108" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><line x1="234" y1="196" x2="210" y2="246" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="210" cy="246" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="200" y="350" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1B1F24" text-anchor="middle">Front link (M3)</text><text x="200" y="372" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7078" text-anchor="middle">Bar up to the strut</text><rect x="440" y="80" width="280" height="24" rx="0" fill="#E