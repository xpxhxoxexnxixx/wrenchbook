<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520"><title>Front strut stack, top to bottom</title><rect width="800" height="520" fill="#F9F9F5"/><line x1="240" y1="30" x2="240" y2="490" stroke="#B7B7B4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><rect x="226" y="40" width="28" height="14" rx="0" fill="#1B1F24" stroke="#1B1F24" stroke-width="1"/><text x="420" y="45.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Shaft nut</text><text x="420" y="63.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">hold the shaft, don't over-tighten</text><line x1="292" y1="47.0" x2="410" y2="47.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><rect x="192" y="78" width="96" height="26" rx="0" fill="#DCEBEA" stroke="#1B1F24" stroke-width="2"/><text x="420" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Top mount + bearing</text><text x="420" y="107.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">plate goes on here</text><line x1="292" y1="91.0" x2="410" y2="91.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><rect x="200" y="128" width="80" height="10" rx="0" fill="#B7B7B4" stroke="#1B1F24" stroke-width="1"/><text x="420" y="131.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Spring pad</text><text x="420" y="149.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">new with the spring</text><line x1="292" y1="133.0" x2="410" y2="133.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><path d="M205.0,162.0 L275.0,171.2 L205.0,180.3 L275.0,189.5 L205.0,198.7 L275.0,207.8 L205.0,217.0 L275.0,226.2 L205.0,235.3 L275.0,244.5 L205.0,253.7 L275.0,262.8 L205.0,272.0" fill="none" stroke="#0E494D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="215.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Spring</text><text x="420" y="233.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">compress before you open it</text><line x1="292" y1="217.0" x2="410" y2="217.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><rect x="222" y="296" width="36" height="40" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2"/><text x="420" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Bump stop + boot</text><text x="420" y="332.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">replace together</text><line x1="292" y1="316.0" x2="410" y2="316.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><rect x="226" y="360" width="28" height="60" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2"/><text x="420" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Damper</text><text x="420" y="406.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">the part that wears out</text><line x1="292" y1="390.0" x2="410" y2="390.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/></svg>