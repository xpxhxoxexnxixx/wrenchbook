<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Supercharger layout</title><rect width="800" height="460" fill="#F9F9F5"/><rect x="300" y="150" width="260" height="180" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><circle cx="200" cy="260" r="46" fill="#DCEBEA" stroke="#1B1F24" stroke-width="3"/><path d="M200,214 C200,140 280,110 380,110 L520,110" fill="none" stroke="#0E494D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="120" width="80" height="60" rx="0" fill="#F9F9F5" stroke="#1B1F24" stroke-width="2"/><text x="30" y="360" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Supercharger</text><text x="30" y="379" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1B1F24" text-anchor="start">belt-driven at the front</text><line x1="150" y1="352" x2="176" y2="300" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="176" cy="300" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="30" y="50" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF5A28" text-anchor="start">Intercooler</text><text x="30" y="69" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FF5A28" text-anchor="start">AA Level 2 and 3</text><line x1="100" y1="78" x2="100" y2="118" stroke="#FF5A28" stroke-width="1.5" stroke-linecap="round"/><circle cx="100" cy="118" r="3.5" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="580" y="90" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="start">Charge pipe</text><text x="580" y="109" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0E494D" text-anchor="start">to the throttle</text><line x1="574" y1="96" x2="524" y2="110" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="524" cy="110" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="580" y="280" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Bigger injectors</text><text x="580" y="299" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1B1F24" text-anchor="start">and new software</text></svg>