<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="An end link joining the sway bar to the strut bracket; a triple-square bit holds the stud while a wrench turns the nut. Inset: the rear link's lower bolt through the control arm"><rect width="600" height="250" fill="#F9F9F5"></rect><rect x="340" y="20" width="40" height="180" rx="6" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></rect><text x="360" y="112" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">strut</text><rect x="312" y="60" width="30" height="16" rx="0" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"></rect><path d="M50 180 H170" fill="none" stroke="#1F4FD6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path><path d="M170 178 L316 70" fill="none" stroke="#1B1F24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="170" cy="178" r="14" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></circle><circle cx="316" cy="70" r="14" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></circle><path d="M170 178 H210" fill="none" stroke="#B5B9C0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path><path d="M206 170 h16 l6 8 l-6 8 h-16 z" fill="#8A8F98" stroke="#8A8F98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><rect x="234" y="173" width="60" height="10" rx="0" fill="#8A8F98" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="132" y="174" width="30" height="8" rx="0" fill="#4A4F58" stroke="#1B1F24" stroke-width="1"></rect><rect x="116" y="170" width="16" height="16" rx="2" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></rect><path d="M124 168 V126" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"></path><text x="124" y="120" text-anchor="middle" fill="#0E5371" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">6 mm triple-square</text><text x="124" y="132" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">holds the stud still</text><path d="M264 184 V214" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"></path><text x="264" y="228" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">16 mm turns the nut (18 on some cars)</text><text x="264" y="240" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">front: 65 Nm · rear at the bar: 55 Nm</text><path d="M342 68 H388" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"></path><text x="392" y="64" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Front: to the strut bracket</text><text x="392" y="76" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">same nut, same torque</text><rect x="420" y="150" width="150" height="60" rx="4" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"></rect><text x="495" y="168" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Rear lower end</text><text x="495" y="182" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">13 mm bolt + nut through</text><text x="495" y="194" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">the control arm · 20 Nm + 180°</text></svg>