<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 232" role="img" aria-label="Battery with negative and positive terminals and the base hold-down clamp; the removal order is numbered"><rect width="600" height="232" fill="#F9F9F5"></rect><rect x="160" y="70" width="240" height="120" rx="8" fill="#2A2E34" stroke="#1B1F24" stroke-width="2"></rect><text x="280" y="140" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">Group H6 · 12V</text><text x="280" y="157" text-anchor="middle" fill="#F1FAFF" font-size="9" font-weight="500" font-family="Plus Jakarta Sans, system-ui, sans-serif">AGM or flooded</text><rect x="184" y="54" width="30" height="20" rx="4" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></rect><text x="199" y="69" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="900" font-family="Plus Jakarta Sans, system-ui, sans-serif">−</text><rect x="346" y="54" width="30" height="20" rx="4" fill="#B3261E" stroke="#B3261E" stroke-width="0"></rect><text x="361" y="69" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="900" font-family="Plus Jakarta Sans, system-ui, sans-serif">+</text><rect x="160" y="186" width="240" height="10" rx="0" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1"></rect><rect x="130" y="160" width="30" height="20" rx="0" fill="#8A8F98" stroke="#1B1F24" stroke-width="1.5"></rect><circle cx="145" cy="170" r="4" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></circle><circle cx="199" cy="30" r="10" fill="#0E5371" stroke="#0E5371" stroke-width="0"></circle><text x="199" y="34" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="900" font-family="Plus Jakarta Sans, system-ui, sans-serif">1</text><text x="50" y="34" text-anchor="start" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">negative off first · 10mm</text><circle cx="361" cy="30" r="10" fill="#0E5371" stroke="#0E5371" stroke-width="0"></circle><text x="361" y="34" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="900" font-family="Plus Jakarta Sans, system-ui, sans-serif">2</text><text x="380" y="34" text-anchor="start" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">then positive</text><circle cx="90" cy="170" r="10" fill="#0E5371" stroke="#0E5371" stroke-width="0"></circle><text x="90" y="174" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="900" font-family="Plus Jakarta Sans, system-ui, sans-serif">3</text><path d="M100 170 H130" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="90" y="200" text-anchor="middle" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">hold-down clamp · 13mm</text><circle cx="430" cy="130" r="10" fill="#0E5371" stroke="#0E5371" stroke-width="0"></circle><text x="430" y="134" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="900" font-family="Plus Jakarta Sans, system-ui, sans-serif">4</text><text x="446" y="134" text-anchor="start" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">lift out · about 45 lb</text><text x="300.0" y="220" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Install in reverse: clamp, positive, negative last. No coding on a Mk5.</text></svg>