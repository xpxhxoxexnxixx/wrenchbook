<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 292" role="img" aria-label="Front of the EA888 Gen 3 block with the intake manifold removed: the water pump and thermostat housing as one module on five captive screws, driven by a belt from the balance-shaft pulley, with two clipped coolant lines and a connector underneath"><rect width="600" height="292" fill="#F9F9F5"></rect><text x="300" y="18" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">front of the Gen 3 block with the intake manifold removed (radiator side)</text><rect x="60" y="60" width="480" height="150" rx="10" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></rect><text x="80" y="78" text-anchor="start" fill="#FFFFFF" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">block, front face</text><rect x="60" y="40" width="480" height="20" rx="4" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><text x="300" y="54" text-anchor="middle" fill="#1B1F24" font-size="8" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">manifold face on the head (8× T30 + 2× 10mm · 9 Nm)</text><rect x="230" y="90" width="150" height="90" rx="10" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></rect><text x="305" y="126" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">pump + thermostat</text><text x="305" y="142" text-anchor="middle" fill="#F1FAFF" font-size="8" font-weight="500" font-family="Plus Jakarta Sans, system-ui, sans-serif">one module</text><circle cx="240" cy="100" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1"></circle><circle cx="370" cy="100" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1"></circle><circle cx="240" cy="170" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1"></circle><circle cx="370" cy="170" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1"></circle><circle cx="305" cy="176" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1"></circle><circle cx="160" cy="150" r="22" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></circle><circle cx="160" cy="150" r="6" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></circle><path d="M180 138 L232 118 M180 162 L232 172" fill="none" stroke="#1B1F24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" ></path><rect x="140" y="86" width="90" height="14" rx="3" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1"></rect><text x="185" y="97" text-anchor="middle" fill="#1B1F24" font-size="7" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">belt cover · 2× T30</text><rect x="380" y="110" width="30" height="14" rx="3" fill="#C89B3C" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="380" y="150" width="30" height="14" rx="3" fill="#C89B3C" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="410" y="112" width="60" height="10" rx="2" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1"></rect><rect x="410" y="152" width="60" height="10" rx="2" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1"></rect><rect x="280" y="180" width="50" height="12" rx="3" fill="#1F4FD6" stroke="#1F4FD6" stroke-width="0"></rect><path d="M370 174 V230 H400" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="404" y="233" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">5 captive T30 · 8 Nm</text><text x="404" y="245" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">lower two need a mirror</text><path d="M160 172 V230 H60" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="60" y="243" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">belt from the balance-shaft pulley</text><text x="60" y="255" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">walk it on while turning the crank (24mm)</text><path d="M470 117 H500 V96" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="500" y="90" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">coolant lines: pull the clips</text><text x="500" y="102" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">with a pick</text><path d="M300 192 V262 H330" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="334" y="265" text-anchor="start" fill="#1F4FD6" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">connector underneath (safety tab)</text><text x="300.0" y="280" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Everything above this drawing has to come off first. The pump itself is the easy part.</text></svg>