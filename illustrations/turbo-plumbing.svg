<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" role="img" aria-label="Schematic of the 2.0T FSI turbo plumbing seen from the passenger side: exhaust manifold on the head, turbo below it, downpipe dropping away, oil feed and return lines, coolant feed and return, diverter valve on the compressor outlet, charge pipe to the intercooler. A K04 keeps every connection; a GT kit replaces the manifold, adds an external wastegate and braided lines." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="700" height="320" fill="#F9F9F5"/><text x="350" y="22" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">passenger side of the engine · what the turbo is connected to</text><rect x="90" y="46" width="300" height="70" rx="8" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"/><text x="240" y="86" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">cylinder head (exhaust side)</text><rect x="130" y="116" width="220" height="30" rx="6" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"/><text x="240" y="136" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">exhaust manifold · 5 nuts to head</text><circle cx="240" cy="200" r="38" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"/><circle cx="240" cy="200" r="16" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"/><text x="240" y="254" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">turbo</text><path d="M262 226 L300 290" stroke="#1B1F24" stroke-width="12" stroke-linecap="round"/><path d="M262 226 L300 290" stroke="#E9E4D8" stroke-width="7" stroke-linecap="round"/><path d="M202 200 H120 V280" stroke="#1B1F24" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M202 200 H120 V