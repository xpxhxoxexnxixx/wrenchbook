asharray="3 3"/><text x="424" y="56" text-anchor="start" fill="#0E494D" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">diverter valve on the compressor outlet</text><text x="424" y="69" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">K04: relocated on kit hoses · fit a Rev D</text><path d="M120 280 L120 300" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="120" y="313" text-anchor="middle" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">to intercooler</text><path d="M350 131 L420 131" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="424" y="127" text-anchor="start" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">manifold</text><text x="424" y="140" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">K04 bolts to the stock one · GT kits replace it</text></svg>