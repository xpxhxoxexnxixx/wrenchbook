<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Exploded stack on the front of the head: thermostat with its vent at 12 o'clock, gasket, housing, and the engine-lifting bracket over the top two bolts"><rect width="600" height="300" fill="#F9F9F5"/><rect x="40" y="60" width="70" height="180" rx="0" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><text x="75" y="254" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">Head</text><circle cx="96" cy="90" r="5" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><circle cx="96" cy="150" r="5" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><circle cx="96" cy="210" r="5" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><circle cx="190" cy="150" r="44" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><circle cx="190" cy="150" r="22" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><circle cx="190" cy="116" r="4" fill="#0E494D" stroke="#0E494D" stroke-width="1.6"/><line x1="190" y1="88" x2="190" y2="106" stroke="#0E494D" stroke-width="2" stroke-linecap="round"/><polygon points="190,106 186.6,99.9 193.4,99.9" fill="#0E494D"/><text x="190" y="254" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">Thermostat 88 °C</text><rect x="262" y="66" width="26" height="168" rx="6" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><text x="275" y="254" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">Gasket</text><rect x="320" y="66" width="110" height="168" rx="10" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><path d="M430,120 h40 v60 h-40" fill="none" stroke="#1B1F24" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="345" cy="90" r="5" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><circle cx="345" cy="150" r="5" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><circle cx="345" cy="210" r="5" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><text x="375" y="254" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">Housing</text><path d="M500,70 v60 h30 v-30 h20" fill="none" stroke="#1B1F24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="500" cy="84" r="4" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><circle cx="500" cy="118" r="4" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><text x="525" y="254" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">Lifting bracket</text><text x="525" y="268" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">M8 ×2 · 22 Nm</text><text x="190" y="40" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#0E494D" text-anchor="middle" font-weight="700">Vent / arrow at 12 o'clock</text><text x="336" y="40" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="start">M6 ×3 · 10 Nm</text><line x1="345" y1="44.5" x2="345" y2="150" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="336" y="54" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">Plastic cracks past this</text><text x="240" y="285" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="middle">Dry — no RTV on plastic</text><line x1="275" y1="275.0" x2="275" y2="100" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="520" y="40" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="middle">Longer bolt on top</text><text x="520" y="54" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">(mark it on the way out)</text></