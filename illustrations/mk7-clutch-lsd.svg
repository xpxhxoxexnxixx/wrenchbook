<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="#F9F9F5"/>
<text x="32" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0B4664" text-anchor="start">The front LSD comes out first</text>
<text x="32" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7078" text-anchor="start">Performance Package and Mk7.5 cars. Seen from the passenger side.</text>
<path d="M90,140 L330,140 L360,190 L360,380 L90,380 Z" fill="#C9CED3" stroke="#0F2230" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="360" y="220" width="150" height="120" rx="14" fill="#4F9AA1" stroke="#0F2230" stroke-width="2"/>
<circle cx="378" cy="236" r="8" fill="#0F2230" stroke="#0F2230" stroke-width="2"/>
<circle cx="492" cy="236" r="8" fill="#0F2230" stroke="#0F2230" stroke-width="2"/>
<circle cx="378" cy="324" r="8" fill="#0F2230" stroke="#0F2230" stroke-width="2"/>
<circle cx="492" cy="324" r="8" fill="#0F2230" stroke="#0F2230" stroke-width="2"/>
<circle cx="435" cy="280" r="22" fill="#75D3D8" stroke="#0E494D" stroke-width="2"/>
<circle cx="435" cy="280" r="6" fill="#0F2230" stroke="#0F2230" stroke-width="2"/>
<rect x="410" y="340" width="20" height="16" rx="2" fill="#FF5A28" stroke="#FF5A28" stroke-width="2"/>
<rect x="440" y="340" width="20" height="16" rx="2" fill="#FF5A28" stroke="#FF5A28" stroke-width="2"/>
<line x1="500" y1="236" x2="570" y2="160" stroke="#6B7078" stroke-width="1.5" stroke-linecap="round"/>
<text x="576" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">4 bolts, 16 mm</text>
<text x="576" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">top two by feel, with wobbles</text>
<line x1="447" y1="280" x2="570" y2="250" stroke="#6B7078" stroke-width="1.5" stroke-linecap="round"/>
<text x="576" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Axle cup bolt</text>
<text x="576" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">6 mm hex, deep inside, 33 Nm</text>
<line x1="450" y1="356" x2="570" y2="340" stroke="#6B7078" stroke-width="1.5" stroke-linecap="round"/>
<text x="576" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Two connectors</text>
<text x="576" y="358" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">unplug before it moves</text>
<text x="32" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">Pry the engine forward to give it room, and have a helper take the unit&#x27;s weight.</text>
<text x="32" y="468" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7078" text-anchor="start">It holds about 1 litre of its own fluid: drain it first.</text>
</svg>
