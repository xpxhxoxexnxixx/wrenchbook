<text x="452" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#0F2230" text-anchor="start">Dual-mass flywheel: 12 mm XZN, 60 Nm + 90°, new</text>
<circle cx="44" cy="435" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
