<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-label="Fastener map for removing the Mk5 GTI front bumper cover. Front view: T25 screws along the top edge of the grille, two T25 on the top edge of the bumper under the hood, fog light and side marker plugs behind the cover. View from below: five T25 in each wheel well where the arch liner meets the bumper, ten T25 along the bottom edge, eight bolts holding the undertray."><rect width="700" height="360" fill="#F9F9F5"/><text x="350" y="22" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">bumper cover fasteners · yellow = T25 · grey = undertray bolts</text><text x="175" y="44" text-anchor="middle" fill="#4A4F58" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">front view</text><path d="M40 60 Q175 48 310 60" fill="none" stroke="#1B1F24" stroke-width="2"/><path d="M40 62 L40 200 Q40 214 54 214 L296 214 Q310 214 310 200 L310 62 Z" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"/><path d="M46 66 L120 66 Q126 90 100 100 L46 100 Z" fill="#F1FAFF" stroke="#1B1F24" stroke-width="1.5"/><path d="M304 66 L230 66 Q224 90 250 100 L304 100 Z" fill="#F1FAFF" stroke="#1B1F24" stroke-width="1.5"/><rect x="126" y="70" width="98" height="40" rx="4" fill="#4A4F58" stroke="#1B1F24" stroke-width="1.5"/><rect x="132" y="82" width="86" height="6" rx="2" fill="#1B1F24"/><rect x="132" y="96" width="86" height="6" rx="2" fill="#1B1F24"/><rect x="120" y="150" width="110" height="40" rx="4" fill="#4A4F58" stroke="#1B1F24" stroke-width="1.5"/><rect x="56" y="150" width="48" height="34" rx="4" fill="#4A4F58" stroke="#1B1F24" stroke-width="1.5"/><circle cx="80" cy="167" r="10" fill="#F1FAFF" stroke="#1B1F24" stroke-width="1.2"/><rect x="246" y="150" width="48" height="34" rx="4" fill="#4A4F58" stroke="#1B1F24" stroke-width="1.5"/><circle cx="270" cy="167" r="10" fill="#F1FAFF" stroke="#1B1F24" stroke-width="