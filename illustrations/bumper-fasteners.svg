 marker plugs behind</text><text x="175" y="278" text-anchor="middle" fill="#4A4F58" font-size="8" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">headlight-washer cars: unclip the hose at the pump, cap the tank</text><text x="175" y="292" text-anchor="middle" fill="#4A4F58" font-size="8" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">after the screws: pull each fender "wing" outward, then lift the cover off</text><text x="525" y="44" text-anchor="middle" fill="#4A4F58" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">from below</text><rect x="390" y="60" width="270" height="140" rx="10" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"/><text x="525" y="80" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">bumper cover, underside</text><rect x="440" y="100" width="170" height="70" rx="6" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"/><text x="525" y="140" text-anchor="middle" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">engine undertray</text><path d="M390 90 Q420 90 420 130 Q420 170 390 170" fill="#4A4F58" stroke="#1B1F24" stroke-width="1.5"/><path d="M660 90 Q630 90 630 130 Q630 170 660 170" fill="#4A4F58" stroke="#1B1F24" stroke-width="1.5"/><circle cx="400.0" cy="194" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="428.8888888888889" cy="194" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="457.77777777777777" cy="194" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="486.6666666666667" cy="194" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="515.5555555555555" cy="194" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="544.4444444444445" cy="194" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="573.3333333333334" cy="1