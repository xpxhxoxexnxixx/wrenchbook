rta Sans, system-ui, sans-serif">muffler</text><path d="M244 186 V172 M356 186 V172" fill="none" stroke="#8A8F98" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path><path d="M194 142 V232" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"></path><text x="194" y="246" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Bracket + bushing</text><text x="194" y="258" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">2 bolts, 10 mm triple-square · 20 Nm + 90°</text><path d="M300 124 V40 H320" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"></path><text x="324" y="37" text-anchor="start" fill="#1F4FD6" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Sway bar</text><text x="324" y="49" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">stock 20 mm · upgrades 22–26 mm</text><path d="M74 140 V56" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"></path><text x="74" y="40" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">End link</text><text x="74" y="52" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">16 mm · 55 Nm</text><path d="M356 176 V232 H420" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"></path><text x="424" y="236" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Muffler hangers</text><text x="424" y="24