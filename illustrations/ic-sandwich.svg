<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" role="img" aria-label="Side view of the front cooling stack from the bumper backwards: A/C condenser, intercooler, radiator, fan shroud. Bolt counts for each joint: five condenser to intercooler, four radiator to intercooler, four fan shroud to radiator, two intercooler to support on top. New core fits with spacers between condenser and core."><rect width="700" height="320" fill="#F9F9F5"/><text x="350" y="22" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">side view · the sandwich, front of car on the left</text><rect x="120" y="70" width="44" height="170" rx="6" fill="#75D3D8" stroke="#1B1F24" stroke-width="2"/><text x="142.0" y="160" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif" transform="rotate(-90 142.0 160)">A/C condenser</text><rect x="180" y="70" width="60" height="170" rx="6" fill="#0B4664" stroke="#1B1F24" stroke-width="2"/><text x="210.0" y="160" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif" transform="rotate(-90 210.0 160)">intercooler</text><rect x="260" y="70" width="60" height="170" rx="6" fill="#4F9AA1" stroke="#1B1F24" stroke-width="2"/><text x="290.0" y="160" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif" transform="rotate(-90 290.0 160)">radiator</text><rect x="340" y="70" width="40" height="170" rx="6" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"/><text x="360.0" y="160" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif" transform="rotate(-90 360.0 160)">fan shroud</text><rect x="164" y="90" width="16" height="10" fill="#F2B600" stroke="#1B1F24"/><rect x="164" y="220" width="16" height="10" fill="#F2B600" stroke="#1B1F24"/><circle cx="172" cy="85" r="3" fill="#1B1F24" stroke="#1B1F24" stroke-width="1.2"/><circle cx="172" cy="225" r="3" fill="#1B1F24" stroke="#1B1F24" stroke-width="1.2"/><circle cx="250" cy="100" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="250" cy="210" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="330" cy="95" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="330" cy="215" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="210" cy="66" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="210" cy="244" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><rect x="100" y="60" width="300" height="8" rx="2" fill="#4A4F58"/><rect x="100" y="244" width="300" height="8" rx="2" fill="#4A4F58"/><path d="M172 90 L150 272" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="150" y="286" text-anchor="middle" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">5 × condenser → core</text><text x="150" y="299" text-anchor="middle" fill="#0E494D" font-size="8" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">M6×18, spacers between</text><path d="M250 210 L300 258" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="300" y="272" text-anchor="middle" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">4 × radiator → core</text><text x="300" y="285" text-anchor="middle" fill="#0E494D" font-size="8" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">M6×14, or M6×16 + spacers (ozone-sensor cars)</text><path d="M330 215 L430 258" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="430" y="272" text-anchor="middle" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">4 × T30 fan shroud → radiator</text><path d="M210 66 L210 44" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="210" y="40" text-anchor="middle" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">2 × T30 core → support, top (and pins below)</text><text x="560" y="120" text-anchor="start" fill="#1B1F24" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">order out:</text><text x="560" y="136" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">1 fan shroud</text><text x="560" y="150" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">2 radiator (below)</text><text x="560" y="164" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">3 two top bolts, tilt back</text><text x="560" y="178" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">4 condenser screws</text><text x="560" y="192" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">5 core off its pins, out below</text><text x="560" y="214" text-anchor="start" fill="#C8102E" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">condenser stays connected:</text><text x="560" y="228" text-anchor="start" fill="#C8102E" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">tilt, never lever</text></svg>