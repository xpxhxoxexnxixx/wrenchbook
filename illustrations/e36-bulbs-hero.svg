<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>US versus Euro headlight bulbs</title><rect width="800" height="460" fill="#F9F9F5"/><circle cx="200" cy="190" r="80" fill="#DCEBEA" stroke="#1B1F24" stroke-width="3"/><circle cx="170" cy="190" r="20" fill="#F9F9F5" stroke="#0E494D" stroke-width="3"/><circle cx="230" cy="190" r="20" fill="#F9F9F5" stroke="#FF5A28" stroke-width="3"/><text x="200" y="70" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1B1F24" text-anchor="middle">US housing</text><text x="170" y="310" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0E494D" text-anchor="middle">9006 low beam</text><text x="230" y="340" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FF5A28" text-anchor="middle">9005 high beam</text><circle cx="600" cy="190" r="80" fill="#DCEBEA" stroke="#1B1F24" stroke-width="3"/><circle cx="570" cy="190" r="20" fill="#F9F9F5" stroke="#0E494D" stroke-width="3"/><circle cx="630" cy="190" r="20" fill="#F9F9F5" stroke="#FF5A28" stroke-width="3"/><text x="600" y="70" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1B1F24" text-anchor="middle">Euro glass ellipsoid</text><text x="570" y="310" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0E494D" text-anchor="middle">H1 low beam</text><text x="630" y="340" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FF5A28" text-anchor="middle">H1 high beam</text><text x="400" y="420" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="middle">Check which housing you have before you buy bulbs.</text></svg>