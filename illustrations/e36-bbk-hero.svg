<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Brake upgrade routes</title><rect width="800" height="460" fill="#F9F9F5"/><text x="400" y="50" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1B1F24" text-anchor="middle">Front rotor diameter</text><circle cx="200" cy="120" r="47.25" fill="#E8E8E3" stroke="#B7B7B4" stroke-width="3"/><circle cx="200" cy="120" r="16.537499999999998" fill="#F9F9F5" stroke="#B7B7B4" stroke-width="2"/><text x="340" y="110" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B1F24" text-anchor="start">Stock M3 front</text><text x="340" y="130" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1B1F24" text-anchor="start">315 mm</text><circle cx="200" cy="232" r="48.75" fill="#DCEBEA" stroke="#0E494D" stroke-width="3"/><circle cx="200" cy="232" r="17.0625" fill="#F9F9F5" stroke="#0E494D" stroke-width="2"/><text x="340" y="222" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B1F24" text-anchor="start">ECS 6-piston kit</text><text x="340" y="242" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1B1F24" text-anchor="start">325 mm</text><circle cx="200" cy="344" r="51.75" fill="#DCEBEA" stroke="#3481A2" stroke-width="3"/><circle cx="200" cy="344" r="18.112499999999997" fill="#F9F9F5" stroke="#3481A2" stroke-width="2"/><text x="340" y="334" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1B1F24" text-anchor="start">E46 CSL swap</text><text x="340" y="354" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#1B1F24" text-anchor="start">about 345 mm</text><text x="400" y="440" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="middle">A step up in size brings heat capacity, not just stopping power.</text></svg>