mily="Plus Jakarta Sans, system-ui, sans-serif">3</text><text x="470" y="246" text-anchor="start" fill="#936700" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">paint marks</text><text x="20" y="278" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">1  rear control-arm bolts    2  rack bolts (seat on dowels first)    3  sway-bar brackets</text><text x="20" y="294" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">4  forward subframe bolts    5  long rear subframe bolts</text><text x="20" y="316" text-anchor="start" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Start all by hand → align to the paint marks → torque + angle, rack and subframe last.</text></svg>