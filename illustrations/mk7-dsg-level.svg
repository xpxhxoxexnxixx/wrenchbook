<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="#F9F9F5"/>
<text x="32" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0B4664" text-anchor="start">Setting the level</text>
<text x="32" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7078" text-anchor="start">The overflow tube sets the height. Temperature sets the volume.</text>
<rect x="60" y="120" width="260" height="230" rx="10" fill="#EEF3F5" stroke="#0F2230" stroke-width="2"/>
<rect x="62" y="220" width="256" height="128" rx="8" fill="#C99A3B" stroke="#C99A3B" stroke-width="2"/>
<rect x="178" y="190" width="24" height="160" rx="3" fill="#0F2230" stroke="#0F2230" stroke-width="2"/>
<rect x="170" y="350" width="40" height="20" rx="3" fill="#FF5A28" stroke="#FF5A28" stroke-width="2"/>
<line x1="205" y1="220" x2="330" y2="200" stroke="#6B7078" stroke-width="1.5" stroke-linecap="round"/>
<text x="336" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Excess spills down the tube</text>
<text x="336" y="218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">until oil sits at its top</text>
<line x1="210" y1="360" x2="330" y2="360" stroke="#6B7078" stroke-width="1.5" stroke-linecap="round"/>
<text x="336" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Drain hole: fill adapter goes here</text>
<text x="336" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">and the plug goes back in last</text>
<rect x="60" y="440" width="680" height="18" rx="9" fill="#B7B7B4" stroke="#B7B7B4" stroke-width="2"/>
<rect x="315.0" y="440" width="170.0" height="18" rx="9" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
<text x="60.0" y="482" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="middle">20 °C</text>
<text x="315.0" y="482" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="middle">35 °C</text>
<text x="485.0" y="482" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="middle">45 °C</text>
<text x="740.0" y="482" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="middle">60 °C</text>
<text x="400.0" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0E494D" text-anchor="middle">Check level here</text>
</svg>
