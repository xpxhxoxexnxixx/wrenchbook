<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" role="img" aria-label="Underside of the pump: banjo bolt on the low-pressure line, stubby triple-square bit in its head, box wrench on the bit"><rect width="600" height="270" fill="#F9F9F5"></rect><rect x="270" y="20" width="140" height="70" rx="8" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></rect><text x="340" y="60" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">HPFP · underside</text><rect x="410" y="44" width="160" height="12" rx="0" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="414" y="36" width="32" height="28" rx="3" fill="#C89B3C" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="220" y="132" width="90" height="12" rx="0" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"></rect><circle cx="320" cy="138" r="22" fill="#C89B3C" stroke="#1B1F24" stroke-width="2"></circle><rect x="310" y="90" width="20" height="20" rx="0" fill="#C89B3C" stroke="#1B1F24" stroke-width="1.5"></rect><circle cx="320" cy="138" r="8" fill="#1B1F24" stroke="#1B1F24" stroke-width="2"></circle><rect x="313" y="160" width="14" height="38" rx="0" fill="#4A4F58" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="313" y="166" width="14" height="10" rx="0" fill="#F2B600" stroke="#F2B600" stroke-width="0"></rect><rect x="320" y="186" width="120" height="16" rx="3" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></rect><circle cx="320" cy="194" r="14" fill="none" stroke="#1B1F24" stroke-width="6"></circle><path d="M430 64 V76 H460" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="464" y="79" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">17mm collar</text><text x="464" y="91" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">already loosened</text><path d="M220 138 H190" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="184" y="135" text-anchor="end" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Low-pressure line</text><text x="184" y="147" text-anchor="end" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">into the banjo eye</text><path d="M342 138 H380 V110 H460" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="464" y="107" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Banjo eye</text><text x="464" y="119" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">threads into brass</text><path d="M313 178 H190" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="184" y="175" text-anchor="end" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Stubby M8 triple-square</text><text x="184" y="187" text-anchor="end" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">tape it into the wrench</text><path d="M400 194 H470" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="474" y="197" text-anchor="start" fill="#0E5371" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">13mm box wrench</text><text x="474" y="209" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">on the bit's shank</text><text x="474" y="222" text-anchor="start" fill="#0E494D" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">slow, small turns</text><text x="300.0" y="258" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">The bolt is fine-threaded into brass. Small turns, re-oil, and stop if the bit starts to walk out.</text></svg>