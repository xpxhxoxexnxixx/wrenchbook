<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" role="img" aria-label="Rear lower control arm from above spanning subframe (left) to knuckle (right); inner bushing with eccentric cam adjuster at subframe end, outer bushing at knuckle end, both held by horizontal bolts"><rect width="600" height="290" fill="#F9F9F5"></rect><rect x="20" y="110" width="60" height="120" rx="6" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></rect><text x="50" y="172" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">subframe</text><rect x="500" y="90" width="70" height="150" rx="6" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></rect><text x="535" y="168" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">knuckle</text><rect x="80" y="150" width="420" height="40" rx="6" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><text x="290" y="174" text-anchor="middle" fill="#1B1F24" font-size="11" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">rear lower control arm</text><circle cx="100" cy="170" r="22" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></circle><circle cx="100" cy="170" r="15" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></circle><circle cx="100" cy="170" r="7" fill="#1B1F24" stroke="#1B1F24" stroke-width="2"></circle><rect x="80" y="164" width="52" height="12" rx="1" fill="#B8860B" stroke="#1B1F24" stroke-width="1.5"></rect><circle cx="480" cy="170" r="22" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></circle><circle cx="480" cy="170" r="15" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></circle><circle cx="480" cy="170" r="7" fill="#1B1F24" stroke="#1B1F24" stroke-width="2"></circle><rect x="452" y="164" width="68" height="12" rx="1" fill="#B8860B" stroke="#1B1F24" stroke-width="1.5"></rect><circle cx="100" cy="140" r="10" fill="#B8860B" stroke="#1B1F24" stroke-width="1.5"></circle><text x="100" y="143" text-anchor="middle" fill="#1B1F24" font-size="7" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">cam</text><path d="M100 148 V84" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"></path><text x="100" y="74" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Inner bushing (SPF4181K)</text><text x="100" y="86" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">eccentric cam — mark before removal</text><path d="M480 148 V84" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"></path><text x="480" y="74" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Outer bushing (SPF4180K)</text><text x="480" y="86" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">at the knuckle end</text><path d="M290 194 V240" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"></path><text x="290" y="254" text-anchor="middle" fill="#0E5371" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Torque BOTH bolts at ride height</text><text x="290" y="266" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">not in the air — bushing life depends on it</text></svg>