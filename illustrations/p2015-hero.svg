"47" text-anchor="end" fill="#936700" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">arm's pivot: the plastic mount wears here</text><path d="M392 100 H420 V56 H440" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="444" y="53" text-anchor="start" fill="#1F4FD6" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">repair bracket (blue)</text><text x="444" y="65" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">holds the pivot · 2 screws</text><path d="M430 140 V166 H440" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="444" y="169" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">actuator: 3 screws</text><path d="M230 100 V212" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="230" y="226" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">flap shaft, one flap per runner</text><text x="300.0" y="250" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">P2015 is the pivot, not the motor. Fix the mount before buying a motor.</text></svg>