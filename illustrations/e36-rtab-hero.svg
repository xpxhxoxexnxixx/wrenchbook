<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Rear trailing arm bushing and limiter</title><rect width="800" height="460" fill="#F9F9F5"/><rect x="300" y="150" width="400" height="40" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><circle cx="300" cy="170" r="58" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><circle cx="300" cy="170" r="34" fill="#DCEBEA" stroke="#1B1F24" stroke-width="2"/><circle cx="300" cy="170" r="14" fill="#1B1F24" stroke="#1B1F24" stroke-width="1"/><circle cx="700" cy="170" r="48" fill="#F9F9F5" stroke="#1B1F24" stroke-width="3"/><text x="60" y="90" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="start">Limiter</text><text x="60" y="109" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0E494D" text-anchor="start">wraps the bushing</text><line x1="210" y1="94" x2="264" y2="138" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="264" cy="138" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="60" y="300" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF5A28" text-anchor="start">Trailing arm bushing</text><text x="60" y="319" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FF5A28" text-anchor="start">splits here</text><line x1="190" y1="284" x2="292" y2="200" stroke="#FF5A28" stroke-width="1.5" stroke-linecap="round"/><circle cx="292" cy="200" r="3.5" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="440" y="290" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Trailing arm</text><text x="440" y="309" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1B1F24" text-anchor="start">runs back to the wheel</text><line x1="500" y1="268" x2="500" y2="194" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="500" cy="194" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="400" y="420" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="middle">A split bushing lets the arm move, and rear toe changes under load.</text></svg>