<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Cat-back versus axle-back</title><rect width="800" height="460" fill="#F9F9F5"/><line x1="40" y1="220" x2="300" y2="220" stroke="#B7B7B4" stroke-width="10" stroke-linecap="round"/><rect x="300" y="200" width="120" height="40" rx="8" fill="#DCEBEA" stroke="#1B1F24" stroke-width="2"/><line x1="420" y1="220" x2="560" y2="220" stroke="#0E494D" stroke-width="10" stroke-linecap="round"/><rect x="560" y="180" width="160" height="80" rx="14" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><text x="40" y="170" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7078" text-anchor="start">Section 1 (cats)</text><text x="300" y="120" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="start">Cat-back starts here</text><line x1="370" y1="128" x2="360" y2="198" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="360" cy="198" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="560" y="120" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Axle-back: muffler only</text><line x1="620" y1="128" x2="640" y2="178" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="640" cy="178" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="40" y="330" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Band clamps and hanger rubbers hold it all up.</text></svg>