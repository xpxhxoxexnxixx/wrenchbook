<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" role="img" aria-label="View from under the rear of a 4Motion car: propshaft into the Haldex coupling and differential in the centre of the subframe, a halfshaft to each hub, the sway bar arcing under them in two brackets with an end link to each trailing arm"><rect width="600" height="310" fill="#F9F9F5"></rect><text x="300" y="14" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">looking up from under the rear of an R32 (front of car is up)</text><rect x="120" y="40" width="360" height="40" rx="4" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></rect><text x="200" y="65" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Rear subframe</text><rect x="70" y="60" width="26" height="140" rx="4" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><rect x="504" y="60" width="26" height="140" rx="4" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><text x="83" y="216" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">trailing arm</text><text x="517" y="216" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">trailing arm</text><rect x="294" y="24" width="12" height="56" rx="0" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="268" y="80" width="64" height="34" rx="8" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></rect><text x="300" y="101" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">HALDEX</text><rect x="256" y="114" width="88" height="40" rx="8" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></rect><text x="300" y="138" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">differential</text><path d="M256 134 H110 M344 134 H490" fill="none" stroke="#B5B9C0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" ></path><circle cx="110" cy="134" r="10" fill="#4A4F58" stroke="#1B1F24" stroke-width="1.5"></circle><circle cx="490" cy="134" r="10" fill="#4A4F58" stroke="#1B1F24" stroke-width="1.5"></circle><path d="M350 80 V236" fill="none" stroke="#C9CCD1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M110 176 L130 176 Q140 176 145 158 L150 146 L205 146 Q225 146 225 166 L232 176 L368 176 L375 166 Q375 146 395 146 L450 146 L455 158 Q460 176 470 176 L490 176" fill="none" stroke="#1F4FD6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" ></path><rect x="178" y="150" width="30" height="26" rx="3" fill="#1B1F24" stroke="#1B1F24" stroke-width="2"></rect><rect x="392" y="150" width="30" height="26" rx="3" fill="#1B1F24" stroke="#1B1F24" stroke-width="2"></rect><path d="M106 176 L90 140" fill="none" stroke="#1B1F24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M494 176 L510 140" fill="none" stroke="#1B1F24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M306 34 H340" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="344" y="37" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">propshaft from the front</text><path d="M193 176 V236 H154" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="150" y="239" text-anchor="end" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Bracket + bushing</text><text x="150" y="251" text-anchor="end" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">2 bolts, 10mm triple-square</text><path d="M300 154 V244 H330" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="334" y="247" text-anchor="start" fill="#936700" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">differential + Haldex sit where</text><text x="334" y="259" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">the GTI bar would rotate through</text><path d="M410 134 V96 H450" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="454" y="93" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">halfshaft to each hub</text><text x="454" y="105" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">stays connected</text><path d="M448 176 V276 H460" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="464" y="279" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">End link (same as GTI)</text><path d="M300 176 V186 H260" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="256" y="189" text-anchor="end" fill="#1F4FD6" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">4Motion bar</text><text x="356" y="232" text-anchor="start" fill="#8A8F98" font-size="8" font-weight="500" font-family="Plus Jakarta Sans, system-ui, sans-serif">exhaust</text><text x="300.0" y="298" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">The bar arcs around the differential. It comes out sideways around it, not through the middle.</text></svg>