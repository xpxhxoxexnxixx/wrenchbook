" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="474" y="207" text-anchor="start" fill="#936700" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Haldex oil + filter</text><text x="474" y="219" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">G 055 175 A2 · 0.65 L</text><path d="M434 258 V290 H470" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="474" y="293" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">rear diff: gear oil</text><text x="474" y="305" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">G 052 145 S2 · ~0.95 L</text><path d="M336 246 V120 H300" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="296" y="117" text-anchor="end" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">plugs: drain 8mm hex · 30 Nm</text><text x="296" y="129" text-anchor="end" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">fill 5mm hex · 15 Nm · open the fill first</text><text x="300.0" y="318" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Three units, two oils. Never put gear oil in the Haldex or Haldex oil in the differential.</text></svg>