<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Front control arm, seen from above</title><rect width="800" height="460" fill="#F9F9F5"/><path d="M200.0,210.0 L540.0,140.0 L560.0,290.0 Z" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="210" r="20" fill="#DCEBEA" stroke="#1B1F24" stroke-width="2"/><circle cx="550" cy="140" r="14" fill="#F9F9F5" stroke="#1B1F24" stroke-width="2"/><circle cx="560" cy="290" r="22" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="40" y="120" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Ball joint</text><text x="40" y="139" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1B1F24" text-anchor="start">part of the arm</text><line x1="110" y1="140" x2="186" y2="196" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="186" cy="196" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="610" y="120" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Front mount bolt</text><line x1="604" y1="124" x2="562" y2="136" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="562" cy="136" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="610" y="300" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="start">Rear bushing</text><text x="610" y="319" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0E494D" text-anchor="start">locates the arm</text><line x1="604" y1="306" x2="584" y2="296" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="584" cy="296" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="400" y="410" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="middle">When the ball joint wears, the whole arm is replaced.</text></svg>