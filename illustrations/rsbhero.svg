<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="View from under the rear of the car: sway bar clamped to the subframe in two brackets, reaching each trailing arm through a short end link" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="400" height="240" fill="#F4F5F7"></rect><rect x="60" y="40" width="280" height="40" rx="4" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></rect><text x="200" y="65" text-anchor="middle" fill="#fff" font-size="12" font-weight="800" font-family="Archivo, system-ui, sans-serif">Rear subframe</text><rect x="30" y="60" width="26" height="120" rx="4" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><rect x="344" y="60" width="26" height="120" rx="4" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><text x="43" y="200" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="600" font-family="Archivo, system-ui, sans-serif">Trailing arm</text><text x="357" y="200" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="600" font-family="Archivo, system-ui, sans-serif">Trailing arm</text><path d="M70 150 L90 150 Q100 150 105 130 L110 100 L290 100 L295 130 Q300 150 310 150 L330 150" fill="none" stroke="#1F4FD6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path><rect x="130" y="84" width="34" height="32" rx="3" fill="#1B1F24"></rect><rect x="236" y="84" width="34" height="32" rx="3" fill="#1B1F24"></rect><line x1="66" y1="150" x2="50" y2="110" stroke="#1B1F24" stroke-width="6" stroke-linecap="round"></line><line x1="334" y1="150" x2="350" y2="110" stroke="#1B1F24" stroke-width="6" stroke-linecap="round"></line><path d="M147 122 V160" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="147" y="176" text-anchor="middle" fill="#1B1F24" font-size="11" font-weight="600" font-family="Archivo, system-ui, sans-serif">Bracket + bushing</text><text x="147" y="189" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="600" font-family="Archivo, system-ui, sans-serif">2 bolts, 10mm triple-square</text><path d="M200 100 V60" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="200" y="30" text-anchor="middle" fill="#1F4FD6" font-size="12" font-weight="800" font-family="Archivo, system-ui, sans-serif">Sway bar</text><path d="M58 130 H100" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="104" y="127" text-anchor="start" fill="#1B1F24" font-size="11" font-weight="600" font-family="Archivo, system-ui, sans-serif">End link</text><text x="104" y="139" text-anchor="start" fill="#0E494D" font-size="10" font-weight="600" font-family="Archivo, system-ui, sans-serif">16mm nut, 6mm stud</text><text x="200" y="218" text-anchor="middle" fill="#0E494D" font-size="11" font-weight="600" font-family="Archivo, system-ui, sans-serif">The exhaust runs between the two brackets,</text><text x="200" y="232" text-anchor="middle" fill="#0E494D" font-size="11" font-weight="600" font-family="Archivo, system-ui, sans-serif">which is why the bar has to rotate out</text></svg>