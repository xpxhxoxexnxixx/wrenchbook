<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 264" role="img" aria-label="View from under the rear of the car: sway bar in two subframe brackets, an end link to each trailing arm"><rect width="600" height="264" fill="#F9F9F5"></rect><rect x="120" y="40" width="320" height="40" rx="4" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></rect><text x="280" y="65" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Rear subframe</text><rect x="70" y="60" width="26" height="130" rx="4" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><rect x="464" y="60" width="26" height="130" rx="4" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><text x="83" y="208" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">trailing arm</text><text x="477" y="208" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">trailing arm</text><path d="M110 160 L130 160 Q140 160 145 140 L150 110 L410 110 L415 140 Q420 160 430 160 L450 160" fill="none" stroke="#1F4FD6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" ></path><rect x="190" y="94" width="34" height="32" rx="3" fill="#1B1F24" stroke="#1B1F24" stroke-width="2"></rect><rect x="336" y="94" width="34" height="32" rx="3" fill="#1B1F24" stroke="#1B1F24" stroke-width="2"></rect><path d="M106 160 L90 120" fill="none" stroke="#1B1F24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M454 160 L470 120" fill="none" stroke="#1B1F24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M207 128 V212" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="207" y="226" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Bracket + bushing</text><text x="207" y="238" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">2 bolts, 10mm triple-square</text><path d="M280 110 V28 H300" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="304" y="25" text-anchor="start" fill="#1F4FD6" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Sway bar</text><text x="304" y="37" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">stock 21.7mm; upgrades 24–27mm</text><path d="M98 140 H150 V184 H360" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="364" y="187" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">End link</text><text x="364" y="199" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">16mm nut, 6mm stud</text><text x="300.0" y="252" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">The exhaust runs between the brackets, which is why the bar has to rotate out.</text></svg>