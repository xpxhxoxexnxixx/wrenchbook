<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" role="img" aria-label="Diverter valve bolted to the turbo's compressor housing with three Torx bolts and one connector"><rect width="600" height="270" fill="#F9F9F5"></rect><circle cx="200" cy="150" r="80" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></circle><circle cx="200" cy="150" r="60" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></circle><circle cx="200" cy="150" r="22" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></circle><text x="200" y="154" text-anchor="middle" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">turbo</text><text x="200" y="236" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">compressor housing (cold side)</text><rect x="268" y="96" width="70" height="70" rx="35" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></rect><circle cx="303" cy="131" r="26" fill="#4A4F58" stroke="#1B1F24" stroke-width="1.5"></circle><circle cx="303" cy="131" r="10" fill="#1F4FD6" stroke="#1F4FD6" stroke-width="0"></circle><circle cx="303" cy="100" r="5" fill="#F2B600" stroke="#1B1F24" stroke-width="1.5"></circle><circle cx="276" cy="146" r="5" fill="#F2B600" stroke="#1B1F24" stroke-width="1.5"></circle><circle cx="330" cy="146" r="5" fill="#F2B600" stroke="#1B1F24" stroke-width="1.5"></circle><rect x="330" y="120" width="24" height="14" rx="3" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"></rect><path d="M303 96 V60 H340" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="344" y="57" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">3× T30 bolts in a triangle</text><text x="344" y="69" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">the lower two are the awkward ones</text><path d="