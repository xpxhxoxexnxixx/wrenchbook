<text x="420" y="412.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">and a vented gap in the rear disc</text>
<text x="32" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">Retail fitment lists 2019–2021 GTIs with the 340 front; earlier cars got it as an option.</text>
