<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" role="img" aria-label="End of an adjustable sway bar with two holes: the forward hole gives a longer lever and softer rate, the rearward hole a shorter lever and stiffer rate" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="400" height="190" fill="#F4F5F7"></rect><path d="M40 60 H200 L300 60" fill="none" stroke="#1F4FD6" stroke-width="14" stroke-linecap="round"></path><rect x="230" y="46" width="130" height="28" rx="6" fill="#1F4FD6"></rect><circle cx="270" cy="60" r="7" fill="#F4F5F7" stroke="#1B1F24" stroke-width="2"></circle><circle cx="330" cy="60" r="7" fill="#F4F5F7" stroke="#1B1F24" stroke-width="2"></circle><line x1="130" y1="60" x2="130" y2="150" stroke="#8A8F98" stroke-dasharray="4 4"></line><text x="130" y="165" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="600" font-family="Archivo, system-ui, sans-serif">pivot (bushing)</text><path d="M130 100 H330" fill="none" stroke="#1B1F24" stroke-width="1.5"></path><path d="M330 94 v12 M130 94 v12" stroke="#1B1F24" stroke-width="1.5"></path><text x="230" y="94" text-anchor="middle" fill="#1B1F24" font-size="11" font-weight="700" font-family="Archivo, system-ui, sans-serif">Forward hole · longer lever · softer</text><text x="230" y="114" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="600" font-family="Archivo, system-ui, sans-serif">Neuspeed 25mm: about 2× stock</text><path d="M130 135 H270" fill="none" stroke="#1B1F24" stroke-width="1.5"></path><path d="M270 129 v12 M130 129 v12" stroke="#1B1F24" stroke-width="1.5"></path><text x="200" y="129" text-anchor="middle" fill="#1B1F24" font-size="11" font-weight="700" font-family="Archivo, system-ui, sans-serif">Rearward hole · shorter lever · stiffer</text><text x="200" y="150" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="600" font-family="Archivo, system-ui, sans-serif">about 2.5× stock</text><path d="M270 67 V80" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><path d="M330 67 V80" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="270" y="30" text-anchor="middle" fill="#1B1F24" font-size="11" font-weight="800" font-family="Archivo, system-ui, sans-serif">soft</text><text x="330" y="30" text-anchor="middle" fill="#1B1F24" font-size="11" font-weight="800" font-family="Archivo, system-ui, sans-serif">stiff</text><text x="360" y="180" text-anchor="end" fill="#0E494D" font-size="10" font-weight="600" font-family="Archivo, system-ui, sans-serif">toward the rear of the car →</text></svg>