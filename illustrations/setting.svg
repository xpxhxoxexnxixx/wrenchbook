<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 222" role="img" aria-label="End of an adjustable sway bar with two holes: forward is a longer lever and softer, rearward a shorter lever and stiffer"><rect width="600" height="222" fill="#F9F9F5"></rect><path d="M60 70 H320 L420 70" fill="none" stroke="#1F4FD6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" ></path><rect x="330" y="56" width="160" height="28" rx="6" fill="#1F4FD6" stroke="#1F4FD6" stroke-width="0"></rect><circle cx="380" cy="70" r="7" fill="#F9F9F5" stroke="#1B1F24" stroke-width="2"></circle><circle cx="450" cy="70" r="7" fill="#F9F9F5" stroke="#1B1F24" stroke-width="2"></circle><path d="M170 70 V172" fill="none" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"></path><text x="170" y="186" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">pivot (bushing)</text><text x="380" y="40" text-anchor="middle" fill="#1B1F24" font-size="11" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">soft</text><text x="450" y="40" text-anchor="middle" fill="#1B1F24" font-size="11" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">stiff</text><path d="M170 106 H450" fill="none" stroke="#1B1F24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M170 100 v12 M450 100 v12" fill="none" stroke="#1B1F24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ></path><text x="310" y="124" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">Forward hole · longer lever · softer (about 2× stock on a 25mm bar)</text><path d="M170 142 H380" fill="none" stroke="#1B1F24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M170 136 v12 M380 136 v12" fill="none" stroke="#1B1F24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ></path><text x="275" y="158" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">Rearward hole · shorter lever · stiffer (about 2.5× stock)</text><text x="540" y="190" text-anchor="end" fill="#0E494D" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">toward the rear of the car →</text></svg>