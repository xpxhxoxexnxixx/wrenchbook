<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Differential, three bolt-on fixes</title><rect width="800" height="460" fill="#F9F9F5"/><circle cx="400" cy="220" r="100" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><circle cx="400" cy="220" r="52" fill="#DCEBEA" stroke="#1B1F24" stroke-width="2"/><rect x="380" y="90" width="40" height="34" rx="0" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><circle cx="250" cy="220" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><circle cx="550" cy="220" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="40" y="120" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF5A28" text-anchor="start">Mount bolt</text><text x="40" y="139" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FF5A28" text-anchor="start">known to shear in hard use</text><line x1="210" y1="116" x2="378" y2="108" stroke="#FF5A28" stroke-width="1.5" stroke-linecap="round"/><circle cx="378" cy="108" r="3.5" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="40" y="350" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="start">Bushings</text><text x="40" y="369" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0E494D" text-anchor="start">poly or UHMW</text><line x1="110" y1="340" x2="240" y2="232" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="240" cy="232" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="580" y="120" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Cover</text><text x="580" y="139" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1B1F24" text-anchor="start">billet is stronger</text><line x1="574" y1="124" x2="440" y2="186" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="440" cy="186" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="580" y="350" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Limited slip inside:</text><text x="580" y="369" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1B1F24" text-anchor="start">2-clutch from the factory</text><line x1="574" y1="340" x2="470" y2="250" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="470" cy="250" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="400" y="430" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="middle">Gear ratio: 3.23 (1996–99), 3.15 (1995).</text></svg>