<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="#F9F9F5"/>
<text x="32" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0B4664" text-anchor="start">Swapping a flexible brake line</text>
<text x="32" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7078" text-anchor="start">Same layout front and rear: hard line, bracket, hose, banjo, caliper.</text>
<rect x="30" y="196" width="150" height="8" rx="3" fill="#C9CED3" stroke="#0F2230" stroke-width="2"/>
<path d="M180,186 L200,180 L220,186 L220,214 L200,220 L180,214 Z" fill="#4F9AA1" stroke="#0F2230" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="232" y="170" width="22" height="60" rx="2" fill="#6B7078" stroke="#0F2230" stroke-width="2"/>
<rect x="256" y="182" width="12" height="36" rx="2" fill="#FF5A28" stroke="#FF5A28" stroke-width="2"/>
<path d="M270,200 C320,160 360,240 410,200 S500,160 540,200" fill="none" stroke="#8E959C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M270,200 C320,160 360,240 410,200 S500,160 540,200" fill="none" stroke="#D3D7DB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="568" cy="200" r="26" fill="#C9CED3" stroke="#0F2230" stroke-width="2"/>
<circle cx="568" cy="200" r="9" fill="#0F2230" stroke="#0F2230" stroke-width="2"/>
<rect x="600" y="168" width="6" height="64" rx="1" fill="#C07A3A" stroke="#8A5320" stroke-width="1"/>
<rect x="616" y="140" width="150" height="120" rx="14" fill="#4F9AA1" stroke="#0F2230" stroke-width="2"/>
<line x1="200" y1="222" x2="200" y2="292" stroke="#6B7078" stroke-width="1.5" stroke-linecap="round"/>
<text x="40" y="310" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Flare nut on the hard line</text>
<text x="40" y="332" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">line wrench · 14–19 Nm</text>
<line x1="262" y1="220" x2="300" y2="372" stroke="#6B7078" stroke-width="1.5" stroke-linecap="round"/>
<text x="240" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Retaining clip</text>
<text x="240" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">slides out, slides back</text>
<line x1="568" y1="228" x2="520" y2="300" stroke="#6B7078" stroke-width="1.5" stroke-linecap="round"/>
<text x="440" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Banjo bolt · 35 Nm</text>
<text x="440" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">new copper washer each side</text>
<text x="32" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">Hold the hose fitting still while you turn the flare nut, or the line twists.</text>
</svg>
