rta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="end">50/50 BMW blue · pour slowly</text><text x="500" y="262" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="middle">Nose up on ramps</text><text x="300" y="262" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#0E494D" text-anchor="middle" font-weight="700">Key on, engine off · heater full hot, low fan</text><text x="300" y="278" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">Then run at 1,000–1,500 rpm to temperature · cool · top up · recheck after 3 drives</text><text x="80" y="262" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="middle">Start cold</text></svg>