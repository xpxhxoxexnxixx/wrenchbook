<text x="260" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="284" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Intercooler</text>
<text x="284" y="218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">behind the bumper, bumper off</text>
<circle cx="260" cy="247" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
