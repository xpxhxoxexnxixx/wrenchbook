<circle cx="660" cy="96" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="660" y="101" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="196" cy="330" r="14" fill="#FF5A28" stroke="#FF5A28" stroke-width="2"/>
<text x="196" y="335" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="610" cy="330" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="610" y="335" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text>
<circle cx="260" cy="135" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
<text x="260" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="284" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Turbo outlet</text>
<text x="284" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">hot side starts here</text>
