<text x="32" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">4  Hot-side pipe (rubber elbow at the bottom)    5  Cold-side pipe (plastic, can crack)</text>
