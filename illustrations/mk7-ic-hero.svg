<path d="M140,190 C140,300 200,390 250,410" fill="none" stroke="#FF5A28" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M550,410 C640,380 670,300 660,190" fill="none" stroke="#0B4664" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="140" cy="96" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
