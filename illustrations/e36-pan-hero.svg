<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Side section: engine held from above by a support brace, oil pan on the bottom of the block, the front subframe crossing under it must be lowered on a jack to clear the pan"><rect width="600" height="300" fill="#F9F9F5"/><line x1="90" y1="40" x2="510" y2="40" stroke="#1B1F24" stroke-width="4" stroke-linecap="round"/><rect x="150" y="34" width="12" height="40" rx="0" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><rect x="438" y="34" width="12" height="40" rx="0" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><text x="300" y="30" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#0E494D" text-anchor="middle" font-weight="700">Engine support brace (from above)</text><rect x="180" y="80" width="240" height="90" rx="0" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><text x="300" y="128" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">engine block</text><line x1="156" y1="74" x2="156" y2="80" stroke="#1B1F24" stroke-width="4" stroke-linecap="round"/><line x1="444" y1="74" x2="444" y2="80" stroke="#1B1F24" stroke-width="4" stroke-linecap="round"/><path d="M200,170 h200 l-16,44 h-168 Z" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><text x="300" y="196" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">oil pan</text><line x1="200" y1="170" x2="400" y2="170" stroke="#0E494D" stroke-width="3" stroke-linecap="round"/><text x="470" y="150" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#0E494D" text-anchor="start">Pan gasket 11131437237</text><line x1="467" y1="154.5" x2="360" y2="170" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="470" y="164" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">M6 · 10 Nm, M8 · 22 Nm</text><rect x="150" y="250" width="300" height="22" rx="0" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><text x="300" y="265" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">front subframe (rack + PS pump)</text><polygon points="280,272 320,272 310,292 290,292" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6" stroke-linejoin="round"/><line x1="300" y1="236" x2="300" y2="248" stroke="#FF5A28" stroke-width="2" stroke-linecap="round"/><polygon points="300,248 296.6,241.9 303.4,241.9" fill="#FF5A28"/><text x="300" y="232" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#FF5A28" text-anchor="middle">lower a few inches to clear the pan</text><text x="40" y="285" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#1B1F24" text-anchor="start">Sling it — PS lines must not take the weight</text><line x1="200" y1="275.8" x2="200" y2="261" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/></svg>