<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 272" role="img" aria-label="Schematic of a full-replacement MQB intake: heat-shielded cone filter on the factory airbox posts, pipe and silicone couplers to the turbo inlet, the secondary-air fitting and vacuum line retained, and the coolant line IE's kit reroutes"><rect width="600" height="272" fill="#F9F9F5"></rect><text x="300" y="18" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">schematic · front-left of the Mk7 bay, looking down (radiator at the top)</text><rect x="60" y="36" width="480" height="14" rx="4" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><text x="300" y="47" text-anchor="middle" fill="#1B1F24" font-size="8" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">radiator support</text><path d="M90 60 H260 V170 H90 Z" fill="#4F9AA1" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ></path><text x="175" y="86" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">heat shield</text><circle cx="175" cy="128" r="26" fill="#B5B9C0" stroke="#1B1F24" stroke-width="1.5"></circle><circle cx="175" cy="128" r="10" fill="#7FA6E6" stroke="#1B1F24" stroke-width="1"></circle><text x="175" y="170" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">5" cone on the velocity stack</text><circle cx="120" cy="64" r="5" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></circle><circle cx="230" cy="64" r="5" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></circle><path d="M260 128 H330 Q360 128 360 158 V180" fill="none" stroke="#1B1F24" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M260 128 H330 Q360 128 360 158 V180" fill="none" stroke="#B5B9C0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" ></path><rect x="268" y="120" width="20" height="16" rx="3" fill="#1F4FD6" stroke="#1F4FD6" stroke-width="0"></rect><rect x="350" y="170" width="20" height="16" rx="3" fill="#1F4FD6" stroke="#1F4FD6" stroke-width="0"></rect><circle cx="360" cy="196" r="16" fill="#4A4F58" stroke="#1B1F24" stroke-width="1.5"></circle><text x="360" y="200" text-anchor="middle" fill="#FFFFFF" font-size="7" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">turbo</text><rect x="300" y="90" width="14" height="10" rx="2" fill="#F2B600" stroke="#1B1F24" stroke-width="1"></rect><rect x="292" y="102" width="10" height="8" rx="2" fill="#936700" stroke="#1B1F24" stroke-width="1"></rect><path d="M80 190 H270" fill="none" stroke="#C89B3C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M80 190 H270" fill="none" stroke="#E3C36A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M120 64 V28 H150" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="154" y="31" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">shield sits on the two factory grommet posts</text><path d="M278 118 V64 H300" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="304" y="60" text-anchor="start" fill="#1F4FD6" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">couplers: seat, relax, then clamp (5 Nm)</text><path d="M307 96 V110 H400" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="404" y="113" text-anchor="start" fill="#936700" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">SAI adapter (GTI) or block-off</text><text x="404" y="125" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">+ factory vacuum line on a barb</text><path d="M376 196 H400" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="404" y="199" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">turbo inlet</text><text x="404" y="211" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">factory or upgraded TIP</text><path d="M120 190 V226 H60" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="60" y="240" text-anchor="start" fill="#C89B3C" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">IE only: factory coolant line rerouted in silicone</text><text x="300.0" y="260" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">034 kits keep the factory lower box and skip the coolant line; the rest still applies.</text></svg>