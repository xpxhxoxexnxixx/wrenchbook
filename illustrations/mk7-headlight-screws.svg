<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="#F9F9F5"/>
<text x="32" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0B4664" text-anchor="start">Headlight: three screws</text>
<text x="32" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7078" text-anchor="start">Driver&#x27;s side, bumper dropped or off.</text>
<path d="M90,170 L420,140 Q470,140 470,190 L460,300 Q455,330 420,330 L120,330 Q80,330 80,290 Z" fill="#C9CED3" stroke="#0F2230" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="200" cy="240" r="48" fill="#CFE6F2" stroke="#0B4664" stroke-width="2"/>
<circle cx="340" cy="240" r="34" fill="#CFE6F2" stroke="#0B4664" stroke-width="2"/>
<circle cx="450" cy="160" r="6" fill="#FF5A28" stroke="#FF5A28" stroke-width="2"/>
<circle cx="120" cy="170" r="6" fill="#FF5A28" stroke="#FF5A28" stroke-width="2"/>
<circle cx="300" cy="326" r="6" fill="#FF5A28" stroke="#FF5A28" stroke-width="2"/>
<circle cx="450" cy="116" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="450" y="121" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="120" cy="128" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="120" y="133" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="300" cy="368" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="300" y="373" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="528" cy="165" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
<text x="528" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="552" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Top, inboard</text>
<text x="552" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">T25, easy from above</text>
<circle cx="528" cy="239" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
<text x="528" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="552" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Top, rear</text>
<text x="552" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">captive: loosens but stays in</text>
<circle cx="528" cy="313" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
<text x="528" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="552" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Lower, behind the bumper</text>
<text x="552" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">drop the bumper to reach it</text>
<text x="32" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">Lift the unit up and out, then unplug it. Xenon and LED units need their</text>
<text x="32" y="474" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">aim reset with a scan tool afterwards.</text>
</svg>
