<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Steering rack and locking plates</title><rect width="800" height="460" fill="#F9F9F5"/><rect x="180" y="190" width="440" height="40" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2"/><rect x="230" y="180" width="30" height="60" rx="0" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><rect x="540" y="180" width="30" height="60" rx="0" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><rect x="380" y="150" width="40" height="40" rx="0" fill="#DCEBEA" stroke="#1B1F24" stroke-width="2"/><line x1="400" y1="150" x2="400" y2="100" stroke="#1B1F24" stroke-width="5" stroke-linecap="round"/><text x="400" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="middle">Steering shaft and guibo</text><text x="40" y="320" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF5A28" text-anchor="start">Locking plates</text><text x="40" y="339" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FF5A28" text-anchor="start">limit travel on the M3 rack</text><line x1="150" y1="296" x2="238" y2="240" stroke="#FF5A28" stroke-width="1.5" stroke-linecap="round"/><circle cx="238" cy="240" r="3.5" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="520" y="320" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Rack</text><text x="520" y="339" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1B1F24" text-anchor="start">fluid lines on the housing</text><line x1="560" y1="296" x2="500" y2="232" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="500" cy="232" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="400" y="410" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="middle">The M3 rack