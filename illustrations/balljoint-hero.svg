<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Front corner of a Mk5 seen from the front: the steering knuckle stands behind the brake, the lower control arm comes in from the left, and the lower ball joint sits between them, its base bolted up to the arm by three nuts on a backing plate and its stud clamped into the bottom of the knuckle"><rect width="620" height="300" fill="#F9F9F5"></rect><rect x="380" y="70" width="130" height="150" rx="10" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></rect><text x="478" y="205" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">steering</text><text x="478" y="218" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">knuckle</text><circle cx="445" cy="100" r="22" fill="none" stroke="#8A8F98" stroke-width="6"></circle><rect x="40" y="170" width="300" height="30" rx="6" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></rect><text x="150" y="189" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">lower control arm</text><rect x="340" y="168" width="70" height="34" rx="4" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><circle cx="445" cy="182" r="15" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></circle><circle cx="445" cy="182" r="6" fill="#1B1F24" stroke="#1B1F24" stroke-width="1"></circle><rect x="439" y="140" width="12" height="42" rx="1" fill="#B8860B" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="429" y="134" width="32" height="10" rx="1" fill="#F2B600" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="353.5" y="188" width="5" height="26" rx="1" fill="#B8860B" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="348.0" y="214" width="16.0" height="8" rx="1" fill="#F2B600" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="375.5" y="188" width="5" height="26" rx="1" fill="#B8860B" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="370.0" y="214" width="16.0" height="8" rx="1" fill="#F2B600" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="397.5" y="188" width="5" height="26" rx="1" fill="#B8860B" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="392.0" y="214" width="16.0" height="8" rx="1" fill="#F2B600" stroke="#1B1F24" stroke-width="1.5"></rect><text x="230" y="48" text-anchor="start" fill="#0E5371" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">upper stud into the knuckle · 18 mm nut</text><text x="230" y="61" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">20 Nm + 90° · hold the stud with a T40 or 5 mm Allen</text><path d="M300 72 L438 132" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"></path><text x="150" y="244" text-anchor="start" fill="#0E5371" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">3 lower nuts · 16 mm to the control arm</text><text x="150" y="257" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">these studs commonly shear — soak with penetrating oil</text><path d="M200 236 L378 216" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"></path><text x="310" y="270" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">the Mk5 ball joint is a bolt-on part — replace the joint, not the whole arm</text><text x="310" y="284" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">OE restores stock geometry · a camber-adjustable joint (SuperPro) bolts into the same spot</text></svg>