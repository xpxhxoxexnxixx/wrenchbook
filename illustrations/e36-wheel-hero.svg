<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Steering wheel stack</title><rect width="800" height="460" fill="#F9F9F5"/><circle cx="300" cy="230" r="130" fill="none" stroke="#1B1F24" stroke-width="14"/><circle cx="300" cy="230" r="55" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><circle cx="300" cy="230" r="10" fill="#1B1F24" stroke="#1B1F24" stroke-width="1"/><text x="480" y="130" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF5A28" text-anchor="start">Airbag</text><text x="480" y="149" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FF5A28" text-anchor="start">two Torx screws behind the wheel</text><line x1="474" y1="134" x2="346" y2="208" stroke="#FF5A28" stroke-width="1.5" stroke-linecap="round"/><circle cx="346" cy="208" r="3.5" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="480" y="250" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="start">Center bolt</text><text x="480" y="269" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0E494D" text-anchor="start">16 mm, 63 Nm</text><line x1="474" y1="254" x2="312" y2="232" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="312" cy="232" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="480" y="360" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Contact ring behind the wheel:</text><text x="480" y="379" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1B1F24" text-anchor="start">keep it centered</text><line x1="474" y1="364" x2="322" y2="262" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="322" cy="262" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="24" y="410" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7078" text-anchor="start">Disconnect the battery and wait 15 minutes.</text></svg>