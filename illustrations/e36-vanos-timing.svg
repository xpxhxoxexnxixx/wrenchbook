<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Engine timing locked: crankshaft lock pin in the block, both camshaft rear squares flush with the head and held by lock blocks under a bracket"><rect width="600" height="300" fill="#F9F9F5"/><text x="300" y="26" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" fill="#0E494D" text-anchor="middle" font-weight="700">Rear of the head</text><rect x="120" y="40" width="360" height="70" rx="0" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><rect x="180" y="62" width="26" height="26" rx="0" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><rect x="394" y="62" width="26" height="26" rx="0" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><rect x="160" y="56" width="66" height="38" rx="0" fill="none" stroke="#0E494D" stroke-width="2" stroke-dasharray="4 3"/><rect x="374" y="56" width="66" height="38" rx="0" fill="none" stroke="#0E494D" stroke-width="2" stroke-dasharray="4 3"/><line x1="160" y1="50" x2="440" y2="50" stroke="#0E494D" stroke-width="2.5" stroke-linecap="round"/><text x="193" y="79" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#0E494D" text-anchor="middle" font-weight="700">EX</text><text x="407" y="79" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#0E494D" text-anchor="middle" font-weight="700">IN</text><text x="20" y="70" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="start">Exhaust block</text><line x1="95.80000000000001" y1="74.5" x2="160" y2="75" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="20" y="84" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">bolt hole right</text><text x="580" y="70" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="end">Intake block</text><line x1="509.79999999999995" y1="74.5" x2="440" y2="75" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="580" y="84" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="end">bolt hole left</text><text x="300" y="130" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">Squares flush with the head · bracket over both, 13 mm</text><text x="300" y="144" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">Rock each cam with a 24 mm on its hex until the block sits flat</text><text x="300" y="180" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" fill="#0E494D" text-anchor="middle" font-weight="700">Right-rear of the block</text><rect x="200" y="195" width="200" height="70" rx="0" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><circle cx="300" cy="230" r="9" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><rect x="300" y="226" width="80" height="8" rx="0" fill="#0E494D" stroke="#0E494D" stroke-width="1.6"/><circle cx="300" cy="230" r="3" fill="#F9F9F5" stroke="#0E494D" stroke-width="1.6"/><text x="300" y="288" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="middle">Lock hole — rubber plug out, pin in to the depth you measured</text><line x1="300" y1="278.0" x2="300" y2="221" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="470" y="214" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="start">Crank pin</text><line x1="467" y1="218.5" x2="380" y2="230" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="470" y="228" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">Crank must not turn</text><text x="470" y="241" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">(a hair of play is fine)</text><text x="60" y="214" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">TDC marks on the</text><text x="60" y="227" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">balancer aligned first</text><text x="60" y="240" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">(11 o'clock, use a mirror)</text></svg>