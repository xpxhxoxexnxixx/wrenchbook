<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Offset control arm bushing</title><rect width="800" height="460" fill="#F9F9F5"/><circle cx="300" cy="220" r="100" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><circle cx="300" cy="220" r="62" fill="#DCEBEA" stroke="#1B1F24" stroke-width="2"/><circle cx="322" cy="204" r="22" fill="#1B1F24" stroke="#1B1F24" stroke-width="1"/><line x1="300" y1="220" x2="322" y2="204" stroke="#FF5A28" stroke-width="3" stroke-linecap="round"/><circle cx="300" cy="220" r="4" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="470" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Arm housing</text><line x1="464" y1="154" x2="395" y2="180" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="395" cy="180" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="470" y="220" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Bushing</text><text x="470" y="239" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1B1F24" text-anchor="start">rubber, poly or Delrin</text><line x1="464" y1="224" x2="360" y2="236" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="360" cy="236" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="470" y="310" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF5A28" text-anchor="start">Offset sleeve</text><text x="470" y="329" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FF5A28" text-anchor="start">the pivot sits off-centre</text><line x1="464" y1="314" x2="334" y2="218" stroke="#FF5A28" stroke-width="1.5" stroke-linecap="round"/><circle cx="334" cy="218" r="3.5" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="400" y="420" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="middle">Mark which way the offset points before you press the old one out.</text></svg>