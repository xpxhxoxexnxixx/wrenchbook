<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420"><rect width="800" height="420" fill="#F9F9F5"/><text x="30" y="42" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0E494D" text-anchor="start">Reading the old shells</text><text x="30" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5A5F68" text-anchor="start">Lay them out in cylinder order</text><path d="M60,250 A100,100 0 0 1 260,250" fill="none" stroke="#1B1F24" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M80,250 A80,80 0 0 1 240,250" fill="none" stroke="#B7B7B4" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="160" y="300" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="middle">Even grey: normal</text><path d="M305,250 A100,100 0 0 1 505,250" fill="none" stroke="#1B1F24" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M325,250 A80,80 0 0 1 485,250" fill="none" stroke="#C8862A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="405" y="300" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="middle">Copper band: due</text><path d="M550,250 A100,100 0 0 1 750,250" fill="none" stroke="#1B1F24" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M570,250 A80,80 0 0 1 730,250" fill="none" stroke="#9A3A2A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="650" y="300" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="middle">Copper all over: stop</text><text x="400" y="370" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5A5F68" text-anchor="middle">Grooves you can catch with a fingernail on the journal mean the crank needs measuring.</text></svg>