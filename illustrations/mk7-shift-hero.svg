<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="#F9F9F5"/>
<text x="32" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0B4664" text-anchor="start">Shift linkage on top of the gearbox</text>
<text x="32" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7078" text-anchor="start">Under the battery tray and intake. Car in neutral.</text>
<rect x="60" y="150" width="360" height="240" rx="16" fill="#C9CED3" stroke="#0F2230" stroke-width="2"/>
<circle cx="230" cy="270" r="18" fill="#0F2230" stroke="#0F2230" stroke-width="2"/>
<rect x="222" y="200" width="16" height="80" rx="4" fill="#4F9AA1" stroke="#0E494D" stroke-width="2"/>
<circle cx="230" cy="204" r="9" fill="#FF5A28" stroke="#FF5A28" stroke-width="2"/>
<rect x="300" y="300" width="90" height="14" rx="4" fill="#4F9AA1" stroke="#0E494D" stroke-width="2"/>
<circle cx="384" cy="307" r="9" fill="#FF5A28" stroke="#FF5A28" stroke-width="2"/>
<path d="M230,204 C150,170 80,190 30,160" fill="none" stroke="#0F2230" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M384,307 C430,330 460,380 470,440" fill="none" stroke="#0F2230" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="120" y="380" width="160" height="22" rx="4" fill="#6B7078" stroke="#0F2230" stroke-width="2"/>
<line x1="248" y1="270" x2="480" y2="160" stroke="#6B7078" stroke-width="1.5" stroke-linecap="round"/>
<text x="486" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Primary (fore-aft) lever</text>
<text x="486" y="178" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">short shifter replaces this; nut 34 Nm</text>
<line x1="239" y1="204" x2="480" y2="232" stroke="#6B7078" stroke-width="1.5" stroke-linecap="round"/>
<text x="486" y="228" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Cable end-link bushings</text>
<text x="486" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">orange: rubber from the factory</text>
<line x1="393" y1="307" x2="480" y2="304" stroke="#6B7078" stroke-width="1.5" stroke-linecap="round"/>
<text x="486" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Relay (side-to-side) lever</text>
<text x="486" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">slides out of its sleeve</text>
<line x1="280" y1="391" x2="480" y2="380" stroke="#6B7078" stroke-width="1.5" stroke-linecap="round"/>
<text x="486" y="376" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Cable bracket bushings</text>
<text x="486" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">under the bracket bolts</text>
</svg>
