<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" role="img" aria-label="Top view of the front of the car: the radiator support with radiator, condenser and intercooler attached slides forward about four inches on two long M10 bolts threaded into the lower outer holes, after the four 16 mm bolts per side are removed. The crash beam and bumper are already off."><rect width="700" height="320" fill="#F9F9F5"/><text x="350" y="22" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">top view · radiator support slid forward on two long bolts</text><rect x="90" y="120" width="60" height="150" rx="4" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"/><rect x="550" y="120" width="60" height="150" rx="4" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"/><text x="120" y="140" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">frame rail</text><text x="580" y="140" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">frame rail</text><rect x="150" y="150" width="400" height="30" rx="4" fill="none" stroke="#8A8F98" stroke-width="2" stroke-dasharray="6 4"/><text x="350" y="170" text-anchor="middle" fill="#8A8F98" font-size="8" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">original position</text><rect x="150" y="70" width="400" height="30" rx="4" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"/><text x="350" y="90" text-anchor="middle" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">radiator support (radiator · condenser · intercooler stay bolted to it)</text><rect x="160" y="100" width="6" height="60" fill="#0B4664"/><rect x="534" y="100" width="6" height="60" fill="#0B4664"/><path d="M350 148 V108" stroke="#C8102E" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C8102E"/></marker></defs><text x="372" y="128" text-anchor="start" fill="#C8102E" font-size="9" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">≈ 4 in</text><circle cx="156" cy="128" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="544" cy="128" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="156" cy="146" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="544" cy="146" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="156" cy="164" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="544" cy="164" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="156" cy="182" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><circle cx="544" cy="182" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1.2"/><path d="M156 182 L200 232" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="200" y="246" text-anchor="middle" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">4 × 16 mm each side</text><text x="200" y="259" text-anchor="middle" fill="#0E494D" font-size="8" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">remove after the long bolts are in</text><path d="M544 182 L544 232" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="544" y="246" text-anchor="middle" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">4 × 16 mm each side</text><path d="M163 100 L240 40" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="244" y="36" text-anchor="start" fill="#0B4664" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">long M10 × 75 in the lower outer hole (kit)</text><text x="244" y="49" text-anchor="start" fill="#0E494D" font-size="8" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">support slides on it and cannot fall</text><text x="350" y="300" text-anchor="middle" fill="#4A4F58" font-size="8" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">refit: three factory bolts in first, pull the long ones, then the last two</text></svg>