<text x="536" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Locking post in the pocket</text>
<text x="536" y="318" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">10 mm wrench, quarter turn</text>
<circle cx="512" cy="359" r="14" fill="#FF5A28" stroke="#FF5A28" stroke-width="2"/>
<text x="512" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="536" y="364" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Six clips round the edge</text>
<text x="536" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">pop them, then lift off the sill</text>
<text x="32" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">Lift the panel up off the window sill, then unhook the release cable and unplug the switches.</text>
