<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Water pump seen from the front: four M6 studs at the corners, two threaded jacking holes at 3 and 9 o'clock, O-ring in the timing-case bore"><rect width="600" height="300" fill="#F9F9F5"/><text x="160" y="30" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" fill="#0E494D" text-anchor="middle" font-weight="700">Pump face</text><rect x="90" y="60" width="140" height="140" rx="14" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><circle cx="160" cy="130" r="40" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><circle cx="160" cy="130" r="14" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><circle cx="108" cy="78" r="6" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><circle cx="212" cy="78" r="6" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><circle cx="108" cy="182" r="6" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><circle cx="212" cy="182" r="6" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><circle cx="100" cy="130" r="5" fill="#0E494D" stroke="#0E494D" stroke-width="1.6"/><circle cx="220" cy="130" r="5" fill="#0E494D" stroke="#0E494D" stroke-width="1.6"/><text x="300" y="60" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="start">M6 stud + 10 mm nut ×4 · 10 Nm</text><line x1="297" y1="64.5" x2="108" y2="78" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="300" y="130" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#0E494D" text-anchor="start">Jacking hole — M6 × 75 bolt</text><line x1="297" y1="127.25" x2="220" y2="130" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="300" y="144" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">Alternate half-turns L / R</text><text x="300" y="157" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">so the pump walks out square</text><text x="300" y="200" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="start">Pulley bolts ×4 · 10 Nm · washers</text><line x1="297" y1="190.0" x2="160" y2="176" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="460" y="236" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#0E494D" text-anchor="middle" font-weight="700">Bore, in section</text><rect x="400" y="250" width="120" height="30" rx="0" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><rect x="420" y="250" width="80" height="30" rx="0" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.2"/><rect x="420" y="250" width="80" height="6" rx="0" fill="#0E494D" stroke="#0E494D" stroke-width="1.6"/><text x="40" y="232" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">O-ring seat: bright metal all the way round.</text><text x="40" y="246" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">Old rubber left in the bore is why new pumps weep.</text><text x="40" y="260" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">Wet the O-ring with coolant, not grease.</text><text x="460" y="292" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#1B1F24" text-anchor="middle">New O-ring</text><line x1="460" y1="282.8" x2="460" y2="253" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/></svg>