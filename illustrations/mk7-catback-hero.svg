<text x="300" y="355" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="450" cy="160" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="450" y="165" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="680" cy="120" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="680" y="125" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="32" y="404" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">1  Sleeve clamp at the downpipe (13 mm)      2  Cross brace, 4 nuts (13 mm)</text>
<text x="32" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">3  Centre rubber hanger      4  Two rear hanger brackets (13 mm)</text>
<text x="32" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">No cutting on the factory system. Have a helper support it as the rear brackets come off.</text>
