<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520"><title>Clutch stack, exploded</title><rect width="800" height="520" fill="#F9F9F5"/><line x1="250" y1="30" x2="250" y2="490" stroke="#B7B7B4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><rect x="180" y="50" width="140" height="34" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><line x1="326" y1="67.0" x2="400" y2="67.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><text x="412" y="65.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Flywheel</text><text x="412" y="83.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">dual-mass or single-mass</text><rect x="190" y="140" width="120" height="14" rx="0" fill="#B7B7B4" stroke="#1B1F24" stroke-width="2"/><line x1="326" y1="147.0" x2="400" y2="147.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><text x="412" y="145.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Clutch disc</text><text x="412" y="163.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">match it to the flywheel</text><rect x="180" y="210" width="140" height="30" rx="0" fill="#DCEBEA" stroke="#1B1F24" stroke-width="3"/><line x1="326" y1="225.0" x2="400" y2="225.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><text x="412" y="223.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Pressure plate</text><text x="412" y="241.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">heavy-duty or OE</text><rect x="226" y="296" width="48" height="28" rx="0" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><line x1="326" y1="310.0" x2="400" y2="310.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><text x="412" y="308.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0E494D" text-anchor="start">Throw-out bearing</text><text x="412" y="326.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0E494D" text-anchor="start">replace with the clutch</text><circle cx="250" cy="390" r="10" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><line x1="326" y1="390.0" x2="400" y2="390.0" stroke="#0E494D" stroke-width="1.2" stroke-linecap="round"/><text x="412" y="388.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FF5A28" text-anchor="start">Pilot bearing</text><text x="412" y="406.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#FF5A28" text-anchor="start">pressed in the crank</text><text x="412" y="440" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7078" text-anchor="start">Slave cylinder, rear main seal and</text><text x="412" y="458" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#6B7078" text-anchor="start">new bolts belong on the same list.</text></svg>