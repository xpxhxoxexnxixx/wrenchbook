<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Hood and trunk struts</title><rect width="800" height="460" fill="#F9F9F5"/><line x1="80" y1="300" x2="320" y2="300" stroke="#1B1F24" stroke-width="5" stroke-linecap="round"/><line x1="80" y1="300" x2="130" y2="110" stroke="#1B1F24" stroke-width="5" stroke-linecap="round"/><path d="M220,300 L120,140" fill="none" stroke="#0E494D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="300" r="7" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><circle cx="120" cy="140" r="7" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="200" y="360" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1B1F24" text-anchor="middle">Hood</text><line x1="460" y1="300" x2="700" y2="300" stroke="#1B1F24" stroke-width="5" stroke-linecap="round"/><line x1="460" y1="300" x2="510" y2="110" stroke="#1B1F24" stroke-width="5" stroke-linecap="round"/><path d="M600,300 L500,140" fill="none" stroke="#0E494D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="600" cy="300" r="7" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><circle cx="500" cy="140" r="7" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="580" y="360" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#1B1F24" text-anchor="middle">Trunk</text><text x="60" y="60" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="start">Gas strut: clips onto a ball stud</text><text x="60" y="79" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0E494D" text-anchor="start">at each end</text><text x="440" y="60" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Sedan, coupe and convertible hoods</text><text x="440" y="79" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1B1F24" text-anchor="start">use different part numbers</text><text x="400" y="430" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6B7078" text-anchor="middle">Replace in pairs. Prop the lid up first.</text></svg>