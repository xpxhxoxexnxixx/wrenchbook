<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-label="Close-up of the inner tie rod threading into the end of the steering rack with the boot removed: the inner joint is a ball socket on a threaded shank; hold the rack from turning and unthread the inner off its wrench flats"><rect width="600" height="220" fill="#F9F9F5"></rect><rect x="30" y="80" width="150" height="70" rx="8" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></rect><text x="105" y="120" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">steering rack</text><rect x="180" y="104" width="40" height="22" rx="2" fill="#B8860B" stroke="#1B1F24" stroke-width="1.5"></rect><path d="M186 104 L186 126" fill="none" stroke="#1B1F24" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M194 104 L194 126" fill="none" stroke="#1B1F24" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M202 104 L202 126" fill="none" stroke="#1B1F24" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><path d="M210 104 L210 126" fill="none" stroke="#1B1F24" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><rect x="214" y="100" width="26" height="30" rx="3" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><text x="200" y="166" text-anchor="middle" fill="#0E5371" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">wrench flats</text><path d="M210 160 L224 130" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"></path><circle cx="280" cy="115" r="22" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></circle><circle cx="280" cy="115" r="9" fill="#1B1F24" stroke="#1B1F24" stroke-width="1"></circle><rect x="300" y="109" width="150" height="12" rx="3" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></rect><text x="380" y="101" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">to the outer end</text><path d="M380 105 L380 109" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"></path><text x="105" y="60" text-anchor="middle" fill="#0E5371" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">hold the rack from turning</text><path d="M105 64 L105 80" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"></path><text x="300" y="40" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">turn the inner joint off its flats · straight thread, no lock tab</text><text x="300" y="196" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">replace the boot and its clamps whenever the inner comes out · seat the breather tube so the boot can breathe</text></svg>