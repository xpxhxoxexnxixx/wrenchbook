<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Front sway bar layout, seen from above</title><rect width="800" height="460" fill="#F9F9F5"/><rect x="190" y="110" width="50" height="110" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2"/><rect x="560" y="110" width="50" height="110" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2"/><rect x="290" y="90" width="220" height="270" rx="0" fill="none" stroke="#B7B7B4" stroke-width="2"/><circle cx="266" cy="235" r="12" fill="#DCEBEA" stroke="#1B1F24" stroke-width="2"/><circle cx="534" cy="235" r="12" fill="#DCEBEA" stroke="#1B1F24" stroke-width="2"/><line x1="266" y1="300" x2="266" y2="247" stroke="#1B1F24" stroke-width="3" stroke-linecap="round"/><line x1="534" y1="300" x2="534" y2="247" stroke="#1B1F24" stroke-width="3" stroke-linecap="round"/><circle cx="266" cy="300" r="6" fill="#F9F9F5" stroke="#1B1F24" stroke-width="2"/><circle cx="534" cy="300" r="6" fill="#F9F9F5" stroke="#1B1F24" stroke-width="2"/><line x1="266" y1="300" x2="534" y2="300" stroke="#0E494D" stroke-width="8" stroke-linecap="round"/><rect x="325" y="286" width="30" height="28" rx="0" fill="#1B1F24" stroke="#1B1F24" stroke-width="1"/><rect x="445" y="286" width="30" height="28" rx="0" fill="#1B1F24" stroke="#1B1F24" stroke-width="1"/><line x1="400" y1="62" x2="400" y2="34" stroke="#B7B7B4" stroke-width="3" stroke-linecap="round"/><path d="M390,44 L400,32 L410,44" fill="none" stroke="#B7B7B4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="54" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7078" text-anchor="start">FRONT</text><text x="24" y="330" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Sway bar</text><text x="24" y="349" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1B1F24" text-anchor="start">hangs from two brackets</text><line x1="176" y1="322" x2="300" y2="300" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="300" cy="300" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="626" y="330" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Mounting bracket</text><text x="626" y="349" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1B1F24" text-anchor="start">two nuts each side</text><line x1="620" y1="322" x2="478" y2="300" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="478" cy="300" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="626" y="260" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">End link</text><line x1="620" y1="256" x2="538" y2="256" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="538" cy="256" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="24" y="270" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Strut bracket</text><line x1="150" y1="266" x2="254" y2="238" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="254" cy="238" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="24" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B7078" text-anchor="start">Wheel</text><text x="400" y="410" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="middle">No subframe drop needed: the bar slides out past the tie rods.</text></svg>