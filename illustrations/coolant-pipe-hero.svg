<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" role="img" aria-label="Front of the VR6 block: the plastic coolant pipe runs from the water pump socket on the left to the thermostat housing on the right, under the intake manifold. O-rings at both ends of the pipe and where the housing meets the head. The secondary air pump sits in front and comes out first." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="700" height="320" fill="#F9F9F5"/><text x="350" y="22" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">looking at the front of the engine, radiator side; intake manifold above stays on</text><rect x="120" y="40" width="460" height="46" rx="6" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"/><text x="350" y="68" text-anchor="middle" fill="#1B1F24" font-size="11" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">intake manifold (stays on)</text><rect x="120" y="86" width="460" height="150" rx="8" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"/><text x="140" y="104" text-anchor="start" fill="#FFFFFF" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">block, front face</text><circle cx="190" cy="170" r="26" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"/><circle cx="190" cy="170" r="12" fill="#1B1F24"/><rect x="214" y="160" width="230" height="20" rx="10" fill="#E9E4D8" stroke="#1B1F24" stroke-width="2"/><rect x="300" y="132" width="16" height="30" rx="6" fill="#E9E4D8" stroke="#1B1F24" stroke-width="2"/><rect x="370" y="176" width="8" height="22" rx="2" fill="#1B1F24"/><circle cx="374" cy="200" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1"/><rect x="444" y="128" width="110" height="84" rx="10" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"/><text x="499" y="166" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">thermostat</text><text x="499" y="180" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">housing</text><rect x="520" y="112" width="44" height="34" rx="6" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"/><text x="542" y="133" text-anchor="middle" fill="#1B1F24" font-size="8" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">cover</text><circle cx="460" cy="204" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1"/><circle cx="538" cy="204" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1"/><rect x="448" y="132" width="22" height="14" rx="3" fill="#0E494D" stroke="#1B1F24" stroke-width="1.5"/><ellipse cx="216" cy="170" rx="4" ry="12" fill="none" stroke="#C8102E" stroke-width="3"/><ellipse cx="444" cy="170" rx="4" ry="12" fill="none" stroke="#C8102E" stroke-width="3"/><ellipse cx="554" cy="170" rx="4" ry="30" fill="none" stroke="#C8102E" stroke-width="3"/><rect x="250" y="196" width="80" height="34" rx="8" fill="#F9F9F5" stroke="#1B1F24" stroke-width="2" stroke-dasharray="5 4"/><text x="290" y="217" text-anchor="middle" fill="#4A4F58" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">SAI pump</text><path d="M190 197 L190 262" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="190" y="276" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">water pump socket</text><text x="190" y="289" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">pipe seats here first</text><path d="M290 231 L330 262" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="345" y="276" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">secondary air pump</text><text x="345" y="289" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">comes out first</text><path d="M499 213 L499 262" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="499" y="276" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">2 long M6 bolts · 10 Nm</text><text x="499" y="289" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">walk in evenly</text><path d="M308 132 L308 100" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="308" y="96" text-anchor="middle" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">nipple → oil-cooler hose</text><path d="M560 170 L610 170" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="614" y="166" text-anchor="start" fill="#C8102E" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">o-rings ×3</text><text x="614" y="180" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">renew all</text><path d="M564 129 L610 110" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="614" y="106" text-anchor="start" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">cover, 3× M6</text><text x="614" y="119" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">8 Nm</text><path d="M240 160 L240 120" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="240" y="116" text-anchor="middle" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">coolant pipe ("crack pipe")</text></svg>