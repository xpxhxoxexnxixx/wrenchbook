="300" y="128" width="14" height="16" rx="1" fill="#B8860B" stroke="#1B1F24" stroke-width="1.5"></rect><path d="M314 136 L400 128" fill="none" stroke="#1B1F24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="400" cy="128" r="14" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></circle><rect x="430" y="60" width="60" height="150" rx="4" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></rect><text x="460" y="140" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">knuckle</text><rect x="394" y="60" width="12" height="68" rx="1" fill="#B8860B" stroke="#1B1F24" stroke-width="1.5"></rect><rect x="388" y="50" width="24" height="12" rx="1" fill="#B8860B" stroke="#1B1F24" stroke-width="1.5"></rect><path d="M110 120 V88" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"></path><text x="110" y="74" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Inner tie rod</text><text x="110" y="86" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">80 Nm · needs inner tie-rod tool</text><path d="M307 144 V196" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"></path><text x="307" y="210" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Jam nut · 50 Nm</text><text x="307" y="222" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">sets total length = toe · loosen a couple of turns</text><path d="M400 128 V40" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"></path><text x="400" y="32" text-anchor="middle" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Outer tie rod end</text><text x="400" y="44" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">new nut · 45 Nm at knuckle</text><path d="M400 142 V236" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"></path><text x="300" y="246" text-anchor="middle" fill="#0E5371" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Paint-pen mark the threads</text><text x="300" y="258" text-anchor="middle" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">before removal — keeps toe close</text></svg>