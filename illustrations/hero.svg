<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Cutaway: fuel pump piston pressing on the cup-shaped follower, which rides on the camshaft lobe"><rect width="600" height="300" fill="#F9F9F5"></rect><rect x="190" y="20" width="120" height="70" rx="8" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></rect><text x="250" y="62" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">HPFP</text><rect x="240" y="90" width="20" height="60" rx="0" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><path d="M215 130 V172 H285 V130" fill="none" stroke="#1B1F24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M250 178 C 282 178, 292 214, 292 232 A 42 42 0 1 1 208 232 C 208 214, 218 178, 250 178 Z" fill="#4A4F58" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ></path><circle cx="250" cy="232" r="8" fill="#8A8F98" stroke="#1B1F24" stroke-width="1.5"></circle><ellipse cx="250" cy="176" rx="14" ry="4" fill="#1F4FD6"></ellipse><path d="M262 118 H370" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="380" y="121" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Pump piston</text><path d="M288 150 H370" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="380" y="150" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Cam follower</text><text x="380" y="162" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">the sacrificial cup</text><path d="M292 232 H370" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="380" y="235" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Intake cam lobe</text><text x="380" y="247" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">rotates against the cup</text><path d="M236 176 H180" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="170" y="172" text-anchor="end" fill="#1F4FD6" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Wear happens here</text><text x="170" y="185" text-anchor="end" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">the cup's face</text><path d="M305 250 A 60 60 0 0 0 300 205" fill="none" stroke="#0E494D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ></path><path d="M300 205 l-6 8 l9 1 z" fill="#0E494D" stroke="#0E494D" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" ></path><text x="300.0" y="288" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">The cup is designed to wear so the cam does not. When the cup is gone, the cam goes next.</text></svg>