<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Exploded piston bearing stack for the rattle fix, bottom to top: washer, bearing ring, thrust bearing, centre washer on the splined shaft, left-hand T30 bolt, thrust bearing, washer, piston cap"><rect width="600" height="300" fill="#F9F9F5"/><rect x="140.0" y="34" width="120" height="34" rx="3" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><text x="300" y="55.0" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="start">Piston cap · 18 mm · 40 Nm</text><line x1="297" y1="52.25" x2="260.0" y2="51.0" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><rect x="140.0" y="76" width="120" height="8" rx="3" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><text x="300" y="84.0" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="start">Top washer</text><line x1="297" y1="81.25" x2="260.0" y2="80.0" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><rect x="140.0" y="92" width="120" height="12" rx="3" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><text x="300" y="102.0" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="start">Thrust bearing</text><line x1="297" y1="99.25" x2="260.0" y2="98.0" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><rect x="187.0" y="112" width="26" height="14" rx="3" fill="#FFFFFF" stroke="#FF5A28" stroke-width="2"/><text x="300" y="123.0" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#FF5A28" text-anchor="start">T30 bolt · LEFT-hand · 8 Nm</text><line x1="297" y1="120.25" x2="213.0" y2="119.0" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><rect x="140.0" y="134" width="120" height="10" rx="3" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><text x="300" y="143.0" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="start">Centre washer (on the shaft)</text><line x1="297" y1="140.25" x2="260.0" y2="139.0" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><rect x="140.0" y="152" width="120" height="12" rx="3" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><text x="300" y="162.0" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="start">Thrust bearing</text><line x1="297" y1="159.25" x2="260.0" y2="158.0" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><rect x="140.0" y="172" width="120" height="22" rx="3" fill="#FFFFFF" stroke="#0E494D" stroke-width="2"/><text x="300" y="187.0" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#0E494D" text-anchor="start">Ring — new one marked BS</text><line x1="297" y1="184.25" x2="260.0" y2="183.0" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><rect x="140.0" y="202" width="120" height="8" rx="3" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><text x="300" y="210.0" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="start">Bottom washer</text><line x1="297" y1="207.25" x2="260.0" y2="206.0" stroke="#8A8F98" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><rect x="120" y="26" width="160" height="200" rx="0" fill="none" stroke="#B5B9C0" stroke-width="1.2" stroke-dasharray="4 3"/><text x="200" y="240" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">piston cavity</text><text x="290" y="262" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">Test with the cap at 40 Nm: turn the shaft —</text><text x="290" y="275" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="8.5" fill="#8A8F98" text-anchor="start">slight drag, no rocking. Rocks: sand ring; binds: sand washer.</text></svg>