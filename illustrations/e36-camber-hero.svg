<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>What a camber plate does</title><rect width="800" height="460" fill="#F9F9F5"/><rect x="130" y="60" width="180" height="18" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2"/><text x="220" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7078" text-anchor="middle">Strut tower</text><line x1="220" y1="90" x2="220" y2="300" stroke="#1B1F24" stroke-width="6" stroke-linecap="round"/><path d="M185.0,255.0 L255.0,255.0 L255.0,405.0 L185.0,405.0 Z" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="220" y1="160" x2="220" y2="420" stroke="#B7B7B4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="220" y="448" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1B1F24" text-anchor="middle">Stock</text><rect x="490" y="60" width="180" height="18" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2"/><text x="580" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B7078" text-anchor="middle">Strut tower</text><rect x="522" y="78" width="60" height="12" rx="0" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><line x1="552" y1="90" x2="580" y2="300" stroke="#1B1F24" stroke-width="6" stroke-linecap="round"/><path d="M534.9,260.6 L604.2,250.9 L625.1,399.4 L555.8,409.1 Z" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="580" y1="160" x2="580" y2="420" stroke="#B7B7B4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="580" y="448" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1B1F24" text-anchor="middle">With camber plate</text><text x="246" y="140" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1B1F24" text-anchor="start">Stock: wheel</text><text x="246" y="158" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1B1F24" text-anchor="start">stands straight</text><text x="612" y="140" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0E494D" text-anchor="start">Plate: strut top</text><text x="612" y="158" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0E494D" text-anchor="start">moves in, wheel</text><text x="612" y="176" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0E494D" text-anchor="start">leans in</text></svg>