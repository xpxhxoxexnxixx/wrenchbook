amily="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5A5F68" text-anchor="middle">~+20–25 whp</text><text x="315" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5A5F68" text-anchor="middle">~+35 whp with tune</text><text x="500" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5A5F68" text-anchor="middle">~+15–25 whp more</text><text x="685" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5A5F68" text-anchor="middle">~+45 whp (one car)</text><text x="400" y="340" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#5A5F68" text-anchor="middle">Ranges from Right Foot Down, 22RPD and Buildjournal; every car differs</text></svg>