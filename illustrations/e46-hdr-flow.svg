<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400"><rect width="800" height="400" fill="#F9F9F5"/><text x="30" y="42" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0E494D" text-anchor="start">US vs Euro layout</text><text x="30" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#5A5F68" text-anchor="start">Why Euro manifolds are a popular swap</text><text x="200" y="110" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0E494D" text-anchor="middle">US</text><text x="600" y="110" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0E494D" text-anchor="middle">Euro</text><rect x="80" y="140" width="120" height="60" rx="4" fill="#C8862A" stroke="#C8862A" stroke-width="2"/><text x="140" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B1F24" text-anchor="middle">Manifold + cats</text><line x1="200" y1="170" x2="330" y2="170" stroke="#1B1F24" stroke-width="6" stroke-linecap="round"/><rect x="240" y="158" width="60" height="24" rx="4" fill="#9AD4D7" stroke="#1B1F24" stroke-width="2"/><text x="270" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B1F24" text-anchor="middle">Resonator</text><rect x="480" y="140" width="120" height="60" rx="4" fill="#E6EEF0" stroke="#1B1F24" stroke-width="2"/><text x="540" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B1F24" text-anchor="middle">Catless manifold</text><line x1="600" y1="170" x2="730" y2="170" stroke="#1B1F24" stroke-width="6" stroke-linecap="round"/><rect x="640" y="158" width="60" height="24" rx="4" fill="#C8862A" stroke="#C8862A" stroke-width="2"/><text x="670" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B1F24" text-anchor="middle">Cats</text><text x="400" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5A5F68" text-anchor="middle">Euro section 1 flanges are clocked differently from US ones</text><text x="400" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5A5F68" text-anchor="middle">Pick a section 1 that matches your headers</text></svg>