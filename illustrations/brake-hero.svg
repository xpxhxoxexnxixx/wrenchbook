<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" role="img" aria-label="Brake assembly: rotor on the hub, carrier bolted to the knuckle with two large bolts, caliper sliding on two guide pins held by two small bolts"><rect width="600" height="290" fill="#F9F9F5"></rect><circle cx="180" cy="150" r="100" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></circle><circle cx="180" cy="150" r="98" fill="none" stroke="#6B7078" stroke-width="1"></circle><circle cx="180" cy="150" r="36" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></circle><circle cx="180" cy="150" r="6" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></circle><circle cx="201.45872598765163" cy="164.68070430827092" r="4" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></circle><circle cx="172.83465358256265" cy="174.9931552773578" r="4" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></circle><circle cx="154.02248609289472" cy="151.08109722326554" r="4" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></circle><circle cx="170.78276430874857" cy="125.68863298348032" r="4" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></circle><circle cx="200.1647128412665" cy="133.58706741531964" r="4" fill="#1B1F24" stroke="#1B1F24" stroke-width="0"></circle><circle cx="198" cy="116" r="3.5" fill="#F2B600" stroke="#1B1F24" stroke-width="1"></circle><path d="M262 86 L326 86 Q342 86 342 102 L342 198 Q342 214 326 214 L262 214 Z" fill="#8A8F98" stroke="#1B1F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ></path><rect x="268" y="108" width="60" height="84" rx="8" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></rect><text x="298" y="154" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">caliper</text><circle cx="280" cy="96" r="6" fill="#1F4FD6" stroke="#1B1F24" stroke-width="1.5"></circle><circle cx="280" cy="204" r="6" fill="#1F4FD6" stroke="#1B1F24" stroke-width="1.5"></circle><circle cx="334" cy="110" r="7" fill="#0E5371" stroke="#1B1F24" stroke-width="1.5"></circle><circle cx="334" cy="190" r="7" fill="#0E5371" stroke="#1B1F24" stroke-width="1.5"></circle><rect x="266" y="122" width="4" height="56" rx="0" fill="#C89B3C" stroke="#C89B3C" stroke-width="0"></rect><path d="M280 90 V60 H370" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="374" y="57" text-anchor="start" fill="#1F4FD6" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Guide bolts (small)</text><text x="374" y="69" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">front 28–35 Nm · rear 35 Nm new</text><path d="M341 110 H370 V140" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="374" y="143" text-anchor="start" fill="#0E5371" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Carrier bolts (big)</text><text x="374" y="155" text-anchor="start" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">front 190–200 · rear 90 Nm + 90° new</text><path d="M198 112 V44 H160" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="154" y="41" text-anchor="end" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">Set screw, T30</text><text x="154" y="53" text-anchor="end" fill="#0E494D" font-size="9" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">snug only; it strips easily</text><path d="M180 186 V262" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="180" y="276" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">clean the hub face before the new rotor goes on</text><path d="M268 150 H230 V222 H300" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="304" y="225" text-anchor="start" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">pads: grease the ears, never the faces</text></svg>