<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Driveline from transmission to differential, side view</title><rect width="800" height="460" fill="#F9F9F5"/><rect x="40" y="170" width="120" height="70" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><circle cx="190" cy="205" r="26" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><line x1="216" y1="205" x2="400" y2="205" stroke="#1B1F24" stroke-width="14" stroke-linecap="round"/><rect x="400" y="192" width="14" height="26" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="2"/><circle cx="430" cy="205" r="16" fill="#DCEBEA" stroke="#1B1F24" stroke-width="2"/><line x1="446" y1="205" x2="620" y2="205" stroke="#1B1F24" stroke-width="14" stroke-linecap="round"/><rect x="620" y="170" width="110" height="70" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><text x="40" y="90" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Transmission</text><line x1="90" y1="98" x2="100" y2="168" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="100" cy="168" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="140" y="330" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF5A28" text-anchor="start">Guibo</text><text x="140" y="349" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FF5A28" text-anchor="start">flex disc, rubber</text><line x1="190" y1="322" x2="190" y2="234" stroke="#FF5A28" stroke-width="1.5" stroke-linecap="round"/><circle cx="190" cy="234" r="3.5" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="340" y="330" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="start">Center support bearing</text><text x="340" y="349" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0E494D" text-anchor="start">holds the two-piece shaft</text><line x1="430" y1="322" x2="430" y2="224" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="430" cy="224" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="600" y="90" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Differential</text><line x1="660" y1="98" x2="670" y2="168" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="670" cy="168" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="400" y="430" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="middle">If one rubber part fails, check all three.</text></svg>