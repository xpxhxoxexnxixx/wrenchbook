<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" role="img" aria-label="Front view of the engine bay behind the bumper. The new OE-location intercooler sits low. On the right, the turbo outlet pipe drops to the core through a billet adapter and the S-shaped hose. On the left, the L-shaped hose rises from the core to the throttle body pipe. Clamps at every joint."><rect width="700" height="320" fill="#F9F9F5"/><text x="350" y="22" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">front view · OE-location core and the two kit hoses</text><rect x="150" y="190" width="400" height="60" rx="8" fill="#0B4664" stroke="#1B1F24" stroke-width="2"/><text x="350" y="224" text-anchor="middle" fill="#FFFFFF" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">new intercooler (inlet and outlet face rearward)</text><rect x="560" y="70" width="70" height="26" rx="6" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"/><text x="595" y="87" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">turbo outlet</text><rect x="588" y="96" width="14" height="22" rx="3" fill="#F2B600" stroke="#1B1F24" stroke-width="1.5"/><path d="M595 118 Q595 160 560 175 Q530 190 530 205" fill="none" stroke="#1B1F24" stroke-width="14" stroke-linecap="round"/><path d="M595 118 Q595 160 560 175 Q530 190 530 205" fill="none" stroke="#C8102E" stroke-width="9" stroke-linecap="round"/><rect x="70" y="70" width="70" height="26" rx="6" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"/><text x="105" y="87" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">throttle body pipe</text><path d="M105 96 V150 Q105 190 145 190 H170" fill="none" stroke="#1B1F24" stroke-width="14" stroke-linecap="round"/><path d="M105 96 V150 Q105 190 145 190 H170" fill="none" stroke="#4F9AA1" stroke-width="9" stroke-linecap="round"/><rect x="96" y="101" width="18" height="6" rx="1" fill="#F2B600" stroke="#1B1F24" stroke-width="1"/><rect x="151" y="187" width="18" height="6" rx="1" fill="#F2B600" stroke="#1B1F24" stroke-width="1"/><rect x="586" y="123" width="18" height="6" rx="1" fill="#F2B600" stroke="#1B1F24" stroke-width="1"/><rect x="521" y="195" width="18" height="6" rx="1" fill="#F2B600" stroke="#1B1F24" stroke-width="1"/><path d="M105 140 L40 140" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="36" y="136" text-anchor="end" fill="#4F9AA1" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">"L" hose</text><text x="36" y="149" text-anchor="end" fill="#0E494D" font-size="8" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">driver side</text><path d="M575 160 L660 160" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="664" y="156" text-anchor="start" fill="#C8102E" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">"S" hose</text><text x="664" y="169" text-anchor="start" fill="#0E494D" font-size="8" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">passenger side</text><path d="M602 107 L660 107" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"/><text x="664" y="103" text-anchor="start" fill="#1B1F24" font-size="9" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">billet adapter</text><text x="664" y="116" text-anchor="start" fill="#0E494D" font-size="8" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">takes the factory o-ring, clips in</text><text x="350" y="280" text-anchor="middle" fill="#4A4F58" font-size="8" font-weight="400" font-family="Plus Jakarta Sans, system-ui, sans-serif">yellow bands = clamps · slide them on before the hose goes on · tighten last, after everything sits without a twist</t