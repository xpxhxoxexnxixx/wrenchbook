84 H180" fill="none" stroke="#0E494D" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="176" y="81" text-anchor="end" fill="#1B1F24" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">brace: T50 + 12mm nut</text></svg>