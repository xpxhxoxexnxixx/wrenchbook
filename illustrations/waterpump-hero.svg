<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 292" role="img" aria-label="Rear face of the block: water pump and thermostat housing on five bolts, driven by a small belt from the balance-shaft gear, coupled to the oil cooler, with a brace in front"><rect width="600" height="292" fill="#F9F9F5"></rect><text x="300" y="22" text-anchor="middle" fill="#0E494D" font-size="10" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">looking at the back of the engine, from the firewall side</text><rect x="60" y="40" width="480" height="60" rx="6" fill="#B5B9C0" stroke="#1B1F24" stroke-width="2"></rect><text x="300" y="76" text-anchor="middle" fill="#1B1F24" font-size="11" font-weight="700" font-family="Plus Jakarta Sans, system-ui, sans-serif">intake manifold (stays on)</text><rect x="60" y="100" width="480" height="150" rx="8" fill="#8A8F98" stroke="#1B1F24" stroke-width="2"></rect><text x="80" y="118" text-anchor="start" fill="#FFFFFF" font-size="9" font-weight="600" font-family="Plus Jakarta Sans, system-ui, sans-serif">block, rear face</text><rect x="280" y="120" width="120" height="90" rx="10" fill="#4A4F58" stroke="#1B1F24" stroke-width="2"></rect><text x="340" y="160" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="800" font-family="Plus Jakarta Sans, system-ui, sans-serif">pump housing</text><text x="340" y="176" text-anchor="middle" fill="#F1FAFF" font-size="8" font-weight="500" font-family="Plus Jakarta Sans, system-ui, sans-serif">+ thermostat + sensor</text><circle cx="290" cy="130" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1"></circle><circle cx="390" cy="130" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1"></circle><circle cx="290" cy="200" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1"></circle><circle cx="390" cy="200" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1"></circle><circle cx="340" cy="205" r="4" fill="#F2B600" stroke="#1B1F24" stroke-width="1"></circle><circle cx="240" cy=