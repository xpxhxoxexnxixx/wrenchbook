<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Engine and transmission mounts, seen from above</title><rect width="800" height="460" fill="#F9F9F5"/><rect x="230" y="80" width="340" height="320" rx="0" fill="none" stroke="#B7B7B4" stroke-width="2"/><rect x="330" y="110" width="140" height="150" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><rect x="360" y="270" width="80" height="100" rx="0" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><rect x="300" y="140" width="30" height="30" rx="0" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><rect x="470" y="140" width="30" height="30" rx="0" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><rect x="385" y="340" width="30" height="22" rx="0" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="40" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="start">Engine mounts</text><text x="40" y="169" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0E494D" text-anchor="start">bolt to the subframe</text><line x1="150" y1="152" x2="298" y2="154" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="298" cy="154" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="40" y="250" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Engine</text><text x="610" y="330" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF5A28" text-anchor="start">Transmission mount</text><text x="610" y="349" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FF5A28" text-anchor="start">under the gearbox</text><line x1="604" y1="336" x2="420" y2="350" stroke="#FF5A28" stroke-width="1.5" stroke-linecap="round"/><circle cx="420" cy="350" r="3.5" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="610" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Front subframe</text><line x1="604" y1="154" x2="572" y2="120" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="572" cy="120" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="400" y="440" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="middle">Use the same material front and rear: rubber, poly or solid.</text></svg>