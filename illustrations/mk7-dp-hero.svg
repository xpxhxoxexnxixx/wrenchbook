<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="#F9F9F5"/>
<text x="32" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0B4664" text-anchor="start">Downpipe swap</text>
<text x="32" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7078" text-anchor="start">From the turbo outlet to the cat-back joint.</text>
<rect x="40" y="130" width="120" height="90" rx="10" fill="#6B7078" stroke="#0F2230" stroke-width="2"/>
<path d="M160,175 C260,175 300,260 360,330 L620,360" fill="none" stroke="#0F2230" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="420" y="320" width="110" height="60" rx="14" fill="#C9CED3" stroke="#0F2230" stroke-width="2"/>
<circle cx="560" cy="330" r="8" fill="#FF5A28" stroke="#FF5A28" stroke-width="2"/>
<circle cx="172" cy="140" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="172" y="145" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="330" cy="250" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="330" y="255" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="560" cy="296" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="560" y="301" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="650" cy="330" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="650" y="335" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="520" cy="125" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
<text x="520" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="544" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Turbo clamp</text>
<text x="544" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">6 mm hex; soak it first</text>
<circle cx="520" cy="185" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
<text x="520" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="544" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Brackets</text>
<text x="544" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">13 mm nuts, tight to reach</text>
<text x="32" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">3  Rear O2 sensor: unplug, move to the new pipe    4  Joint to the cat-back</text>
<text x="32" y="466" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">Non-Performance Package cars: remove the small axle heat shield (16 mm) for the second bracket nut.</text>
</svg>
