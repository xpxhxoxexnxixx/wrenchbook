<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460"><title>Parking brake shoes inside the rotor hat</title><rect width="800" height="460" fill="#F9F9F5"/><circle cx="300" cy="230" r="140" fill="#E8E8E3" stroke="#1B1F24" stroke-width="3"/><path d="M205,150 A110,110 0 0 1 395,150" fill="none" stroke="#0E494D" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M205,310 A110,110 0 0 0 395,310" fill="none" stroke="#0E494D" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><rect x="280" y="90" width="40" height="24" rx="0" fill="#1B1F24" stroke="#1B1F24" stroke-width="1"/><rect x="280" y="346" width="40" height="24" rx="0" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><line x1="210" y1="230" x2="390" y2="230" stroke="#B7B7B4" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text x="520" y="100" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1B1F24" text-anchor="start">Adjuster</text><text x="520" y="119" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#1B1F24" text-anchor="start">at the top of the shoes</text><line x1="514" y1="104" x2="322" y2="102" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="322" cy="102" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="520" y="235" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="start">Shoes (4 in the set)</text><text x="520" y="254" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0E494D" text-anchor="start">springs and pin</text><line x1="514" y1="240" x2="398" y2="150" stroke="#0E494D" stroke-width="1.5" stroke-linecap="round"/><circle cx="398" cy="150" r="3.5" fill="#0E494D" stroke="#0E494D" stroke-width="1"/><text x="520" y="390" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF5A28" text-anchor="start">Expander</text><text x="520" y="409" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#FF5A28" text-anchor="start">replace with the shoes</text><line x1="514" y1="394" x2="322" y2="358" stroke="#FF5A28" stroke-width="1.5" stroke-linecap="round"/><circle cx="322" cy="358" r="3.5" fill="#FF5A28" stroke="#FF5A28" stroke-width="1"/><text x="40" y="40" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E494D" text-anchor="start">Photograph the springs</text><text x="40" y="59" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0E494D" text-anchor="start">before you remove anything</text></svg>