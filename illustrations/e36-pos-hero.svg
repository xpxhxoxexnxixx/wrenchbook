<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Where the two position sensors live: crank sensor low on the front of the block above the pulley; cam sensor at the front of the head on early cars, rear near the starter on late cars"><rect width="600" height="300" fill="#F9F9F5"/><rect x="60" y="70" width="150" height="150" rx="0" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><text x="135" y="250" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="middle">S52 · front-left</text><circle cx="95" cy="200" r="24" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><circle cx="95" cy="200" r="8" fill="#FFFFFF" stroke="#1B1F24" stroke-width="1.6"/><text x="95" y="232" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="8" fill="#8A8F98" text-anchor="middle">pulley</text><rect x="86" y="150" width="18" height="28" rx="3" fill="#0E494D" stroke="#0E494D" stroke-width="1.6"/><rect x="72" y="78" width="16" height="22" rx="3" fill="#1B1F24" stroke="#1B1F24" stroke-width="1.6"/><rect x="190" y="150" width="16" height="22" rx="3" fill="#1B1F24" stroke="#1B1F24" stroke-width="1.6" stroke-dasharray="3 2"/><rect x="196" y="176" width="24" height="30" rx="0" fill="#F9F9F5" stroke="#1B1F24" stroke-width="1.6"/><text x="208" y="220" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="8" fill="#8A8F98" text-anchor="middle">starter</text><circle cx="95" cy="164" r="9" fill="#0E494D" stroke="#0E494D" stroke-width="1.6"/><text x="95" y="167.5" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="80" cy="89" r="9" fill="#0E494D" stroke="#0E494D" stroke-width="1.6"/><text x="80" y="92.5" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="198" cy="161" r="9" fill="#0E494D" stroke="#0E494D" stroke-width="1.6"/><text x="198" y="164.5" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="270" y="80" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#0E494D" text-anchor="start" font-weight="700">1 · Crankshaft sensor</text><text x="270" y="95" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">Front of the block, above the crank pulley.</text><text x="270" y="108" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">One bolt. Reads ~550 Ω. A dead one =</text><text x="270" y="121" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">no-start or a hot stall.</text><text x="270" y="150" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="start" font-weight="700">2 · Cam sensor — early</text><text x="270" y="165" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">Early cars: front of the head (easy).</text><text x="270" y="178" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">Swap it in minutes.</text><text x="270" y="210" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" fill="#1B1F24" text-anchor="start" font-weight="700">3 · Cam sensor — late</text><text x="270" y="225" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">Late cars: rear of the head by the starter.</text><text x="270" y="238" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">Do it with the oil filter housing off</text><text x="270" y="251" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="9" fill="#8A8F98" text-anchor="start">for connector access.</text></svg>