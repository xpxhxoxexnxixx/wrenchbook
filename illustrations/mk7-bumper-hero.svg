<text x="240" y="115" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="240" cy="220" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="240" y="225" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="80" cy="190" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="80" y="195" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="240" cy="362" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="240" y="367" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="494" cy="145" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
<text x="494" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="518" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Upper grille: 2</text>
<text x="518" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">pull forward, then up</text>
<circle cx="494" cy="215" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
<text x="494" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="518" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Bumper to cross-member: 2</text>
<text x="518" y="242" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">behind the upper grille, if fitted</text>
<circle cx="494" cy="285" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
<text x="494" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="518" y="290" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Each wheel arch: about 5 + 1</text>
<text x="518" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">plus the vertical one into the fender</text>
<circle cx="494" cy="355" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
<text x="494" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="518" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Underside and belly pan</text>
<text x="518" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">2 per side plus the pan screws</text>
<text x="32" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">Then pop each side out of its fender guide, pull it forward a few inches,</text>
<text x="32" y="464" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">and unplug the fog lights and any headlight-washer hose before it comes free.</text>
</svg>
