<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<rect width="800" height="500" fill="#F9F9F5"/>
<text x="32" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0B4664" text-anchor="start">Battery out and in</text>
<text x="32" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7078" text-anchor="start">Front left of the engine bay, under its cover.</text>
<rect x="80" y="170" width="300" height="200" rx="10" fill="#0F2230" stroke="#0F2230" stroke-width="2"/>
<rect x="70" y="370" width="320" height="24" rx="4" fill="#6B7078" stroke="#0F2230" stroke-width="2"/>
<rect x="110" y="140" width="56" height="34" rx="4" fill="#6B7078" stroke="#0F2230" stroke-width="2"/>
<rect x="300" y="146" width="44" height="28" rx="4" fill="#C0392B" stroke="#8A2A0A" stroke-width="2"/>
<rect x="166" y="148" width="46" height="18" rx="3" fill="#75D3D8" stroke="#0E494D" stroke-width="2"/>
<rect x="186" y="378" width="40" height="26" rx="3" fill="#C9CED3" stroke="#0F2230" stroke-width="2"/>
<circle cx="138" cy="116" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="138" y="121" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="322" cy="116" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="322" y="121" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="206" cy="432" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="206" y="437" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="240" cy="116" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
<text x="240" y="121" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<circle cx="448" cy="165" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="448" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="472" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Negative off first</text>
<text x="472" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">10 mm nut; lift the sensor with it</text>
<circle cx="448" cy="231" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="448" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="472" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Clamp at the base</text>
<text x="472" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">13 mm bolt, then lift: about 40 lb</text>
<circle cx="448" cy="297" r="14" fill="#0B4664" stroke="#0B4664" stroke-width="2"/>
<text x="448" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="472" y="302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Positive off second, on first</text>
<text x="472" y="324" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">10 mm, under the red cover</text>
<circle cx="448" cy="363" r="14" fill="#0E494D" stroke="#0E494D" stroke-width="2"/>
<text x="448" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="472" y="368" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2230" text-anchor="start">Battery sensor (J367)</text>
<text x="472" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7078" text-anchor="start">never pry it off the clamp</text>
<text x="32" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F2230" text-anchor="start">New battery in: positive first, negative last. Then adapt it to the car.</text>
</svg>
